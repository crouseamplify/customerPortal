<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Allocation Manager — Allocation Table Mockup</title>
<!-- Site stylesheets, downloaded from the Staging LWR site (see assets/site-styles) -->
<link rel="stylesheet" href="assets/site-styles/salesforce-lightning-design-system.min.css">
<link rel="stylesheet" href="assets/site-styles/dxp-site-spacing-styling-hooks.min.css">
<link rel="stylesheet" href="assets/site-styles/dxp-styling-hooks.min.css">
<link rel="stylesheet" href="assets/site-styles/site-theme.css"><!-- runtime branding variables the live site injects -->
<link rel="stylesheet" href="assets/site-styles/dxp-slds-extensions.min.css">
<style>
/* ===== Component CSS (copied verbatim from orderAllocationManager.css at build time) ===== */
/* ============================================================
   Container
   ============================================================ */
.oam-container {
    padding: var(--dxp-g-spacing-medium) var(--dxp-g-spacing-large);
    font-family: var(--dxp-g-root-font-family);
    color: var(--dxp-g-root-contrast);
}

.oam-page-header {
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #e0e0e0;
}


/* ============================================================
   BSO List — Program Groups
   ============================================================ */
.program-group {
    border: 1px solid #dddbda;
    border-radius: 6px;
    overflow: hidden;
}

.program-group-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: #f3f2f2;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid #dddbda;
}

.program-group-header:hover {
    background: #eae8e8;
}

.program-name {
    flex: 1;
    font-weight: 600;
    font-size: 0.9375rem;
    color: var(--dxp-g-root-contrast);
}

.order-count {
    font-size: 0.75rem;
    color: #706e6b;
}

.chevron-icon {
    flex-shrink: 0;
}


/* ============================================================
   BSO List — Order Rows
   ============================================================ */
.bso-row {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 0.875rem 1rem;
    border-bottom: 1px solid #f3f2f2;
    transition: background 0.1s;
}

.bso-row:last-child {
    border-bottom: none;
}

.bso-row:hover {
    background: #fafaf9;
}

.bso-info {
    flex: 1;
    min-width: 0;
}

.bso-pq-number {
    font-weight: 600;
    font-size: 0.9375rem;
    color: var(--dxp-g-brand);
    margin-bottom: 0.25rem;
}

.bso-meta {
    font-size: 0.75rem;
    color: #706e6b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.meta-label {
    font-weight: 600;
    color: #444;
}

.bso-status-area {
    min-width: 110px;
    text-align: center;
    flex-shrink: 0;
}

.bso-actions {
    flex-shrink: 0;
}


/* ============================================================
   Status Badges
   ============================================================ */
.status-badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
}

.status-open        { background: #e3f0ff; color: var(--dxp-g-brand); }
.status-draft       { background: #f3f2f2; color: #706e6b; }
.status-submitted   { background: #e8f5e0; color: #2e7d32; }
.status-confirmed   { background: #efe8fc; color: #5c35cc; }
.status-cancelled   { background: #fce8e8; color: var(--dxp-g-destructive); }
.status-in-progress { background: #fff3e0; color: #e65100; }
.status-new         { background: #e3f0ff; color: var(--dxp-g-brand); }
.status-default     { background: #f3f2f2; color: #706e6b; }


/* ============================================================
   Breadcrumb + BSO Summary Bar
   ============================================================ */
.breadcrumb {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.8125rem;
    color: #706e6b;
}

.breadcrumb-link {
    color: var(--dxp-g-brand);
    cursor: pointer;
    text-decoration: none;
}

.breadcrumb-link:hover {
    text-decoration: underline;
}

.breadcrumb-sep     { color: #b0adab; }
.breadcrumb-current { color: var(--dxp-g-root-contrast); font-weight: 500; }

.bso-summary-bar {
    display: flex;
    gap: var(--dxp-g-spacing-xlarge);
    flex-wrap: wrap;
    align-items: center;
}

.summary-field {
    display: flex;
    flex-direction: column;
    gap: 0.125rem;
}

.summary-label {
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #706e6b;
    font-weight: 600;
}

.summary-value {
    font-size: 0.875rem;
    color: var(--dxp-g-root-contrast);
    font-weight: 500;
}


/* ============================================================
   Manager Body  (table + drawer side-by-side)
   ============================================================ */
.manager-body {
    display: flex;
    border: 1px solid #dddbda;
    border-radius: 6px;
    overflow: hidden;
    min-height: 400px;
}

.table-section {
    flex: 1;
    min-width: 0;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}


/* ============================================================
   Toolbar
   ============================================================ */
.toolbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.75rem;
    flex-shrink: 0;
}

.toolbar-left {
    display: flex;
    align-items: flex-end;
    gap: 0.75rem;
    flex: 1;
}

.search-wrapper { width: 260px; }
.filter-wrapper { width: 200px; }


/* ============================================================
   Allocation Table
   ============================================================ */
.table-scroll-container {
    overflow: auto;
    flex: 1;
    border: 1px solid #dddbda;
    border-radius: 4px;
    min-height: 200px;
    max-height: calc(100vh - 340px);
}

.allocation-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;  /* collapsed borders leave a 1px seam in the sticky header where scrolled rows show through */
    table-layout: auto;
}

/* Sticky header */
.allocation-table thead {
    position: sticky;
    top: 0;
    z-index: 10;
}

/* Frozen columns */
.th-freeze-1, .td-freeze-1 {
    position: sticky;
    left: 0;
    z-index: 5;
    background: #fff;
    min-width: 230px;
    max-width: 260px;
}

.th-freeze-2, .td-freeze-2 {
    position: sticky;
    left: 230px;
    z-index: 5;
    background: #fff;
    min-width: 88px;
}

.th-freeze-3, .td-freeze-3 {
    position: sticky;
    left: 318px;
    z-index: 5;
    background: #fff;
    min-width: 88px;
}

.th-freeze-4, .td-freeze-4 {
    position: sticky;
    left: 406px;
    z-index: 5;
    background: #fff;
    min-width: 88px;
}

.allocation-table thead .th-freeze-1,
.allocation-table thead .th-freeze-2,
.allocation-table thead .th-freeze-3,
.allocation-table thead .th-freeze-4 {
    z-index: 11;
    background: #f3f2f2;
}

/* Column sizing */
.col-product { min-width: 230px; }
.col-isbn    { min-width: 130px; }
.col-number  { min-width: 88px; text-align: right; white-space: nowrap; }
.col-input   { min-width: 130px; }
.col-remaining-header { font-weight: 700; }

/* Header row 1 — site names */
.site-header-row th {
    padding: 0.5rem 0.5rem 0.25rem;
    background: #f3f2f2;
    border-bottom: 1px solid #dddbda;
    font-weight: 600;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #3e3e3c;
    vertical-align: bottom;
}

/* Active site column highlight */
.site-th-active {
    background: #eaf4ff !important;
}

/* Header row 2 — "Assigned" label */
.col-label-row th {
    padding: 0.2rem 0.5rem;
    background: #f3f2f2;
    border-bottom: 2px solid #dddbda;
    font-size: 0.6875rem;
    color: #706e6b;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
}

.col-assigned-label {
    text-align: center;
}

/* Product rows */
.product-row td {
    padding: 0.35rem 0.5rem;
    border-bottom: 1px solid #f3f2f2;
    vertical-align: middle;
    font-size: 0.8125rem;
}

.product-row:hover td {
    background: #fafaf9;
}

.product-row:hover .td-freeze-1,
.product-row:hover .td-freeze-2,
.product-row:hover .td-freeze-3,
.product-row:hover .td-freeze-4 {
    background: #fafaf9;
}

.product-name {
    font-weight: 500;
    color: var(--dxp-g-root-contrast);
    line-height: 1.3;
}

.product-meta-row {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    margin-top: 0.1rem;
}

.product-program-label {
    font-size: 0.6875rem;
    color: #b0adab;
}

.product-isbn-inline {
    font-size: 0.6875rem;
    color: #b0adab;
}

.product-isbn-inline::before {
    content: '·';
    margin-right: 0.375rem;
    color: #c9c7c5;
}

/* Remaining column states */
.remaining-error {
    color: var(--dxp-g-destructive) !important;
    font-weight: 700;
    background: #fff8f8;
}

.icon-over-allocated {
    --slds-c-icon-color-foreground: var(--dxp-g-destructive);
    vertical-align: middle;
    margin-right: 0.25rem;
}

.remaining-zero {
    color: #e65100;
    font-weight: 700;
}


/* ============================================================
   Site Column Header Content
   ============================================================ */
.site-header-content {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-width: 130px;
}

.site-name-row {
    display: flex;
    align-items: center;
    gap: 0.3rem;
}

.site-name-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--dxp-g-brand);
    padding: 0;
    text-align: left;
    line-height: 1.2;
}

.site-name-btn:hover {
    text-decoration: underline;
}

.site-controls {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    flex-wrap: wrap;
}

.icon-configured { --slds-c-icon-color-foreground: #2e7d32; }
.icon-warning    { --slds-c-icon-color-foreground: #e65100; }


/* ============================================================
   Quantity Input Cells
   ============================================================ */
.input-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
}

.qty-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid #dddbda;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 600;
    color: #444;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
}

.qty-btn:hover {
    border-color: var(--dxp-g-brand);
    color: var(--dxp-g-brand);
    background: #e8f4ff;
}

.qty-input {
    width: 58px;
    text-align: center;
    border: 1px solid #dddbda;
    border-radius: 4px;
    padding: 0.2rem 0.25rem;
    font-size: 0.8125rem;
    background: #fff;
    transition: border-color 0.1s, box-shadow 0.1s;
}

.qty-input:focus {
    outline: none;
    border-color: var(--dxp-g-brand);
    box-shadow: 0 0 0 2px rgba(1, 105, 228, 0.18);
}

.qty-error {
    border-color: var(--dxp-g-destructive);
    background: #fff8f8;
}

.qty-disabled {
    background: #f3f2f2;
    color: #a8a8a8;
    cursor: not-allowed;
    border-color: #e0e0e0;
}

/* Remove browser number spinners */
.qty-input::-webkit-inner-spin-button,
.qty-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.qty-input[type=number]               { -moz-appearance: textfield; }


/* ============================================================
   Table Footer
   ============================================================ */
.table-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.25rem 0.25rem;
    flex-shrink: 0;
}

.product-count {
    font-size: 0.75rem;
    color: #706e6b;
}

.page-size-picker {
    display: flex;
    align-items: center;
    gap: 0.375rem;
}

.page-size-label {
    font-size: 0.75rem;
    color: #706e6b;
    white-space: nowrap;
}

.page-size-select {
    font-size: 0.75rem;
    color: var(--dxp-g-root-contrast);
    border: 1px solid #dddbda;
    border-radius: 4px;
    padding: 0.1rem 0.25rem;
    background: #fff;
    cursor: pointer;
    height: 24px;
}

.page-size-select:focus {
    outline: none;
    border-color: var(--dxp-g-brand);
    box-shadow: 0 0 0 1px var(--dxp-g-brand);
}

.pagination-controls {
    display: flex;
    align-items: center;
    gap: 0.375rem;
}

.page-label {
    font-size: 0.75rem;
    color: #444;
    min-width: 72px;
    text-align: center;
}

.footer-actions {
    display: flex;
    gap: 0.5rem;
}


/* ============================================================
   Right Drawer
   ============================================================ */
.site-drawer {
    width: 0;
    min-width: 0;
    overflow: hidden;
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                min-width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 0 solid #dddbda;
    background: #fafaf9;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.site-drawer.drawer-open {
    width: 380px;
    min-width: 380px;
    border-left-width: 1px;
}

.drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    background: #f3f2f2;
    border-bottom: 1px solid #dddbda;
    flex-shrink: 0;
}

.drawer-title {
    font-weight: 600;
    font-size: 0.9375rem;
    color: var(--dxp-g-root-contrast);
}

.drawer-close-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.2rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    color: #706e6b;
}

.drawer-close-btn:hover {
    background: #e0e0e0;
}

.drawer-body {
    padding: 0;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.drawer-section {
    padding: 1rem;
    border-bottom: 1px solid #e8e7e7;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.drawer-section:last-of-type {
    border-bottom: none;
}

.drawer-section-title {
    font-size: 0.8125rem;
    font-weight: 700;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0;
}

.drawer-section-hint {
    font-size: 0.75rem;
    color: #706e6b;
    margin: 0;
    line-height: 1.4;
}

.drawer-field {
    /* spacing handled by drawer-section gap */
}

.address-preview {
    display: flex;
    align-items: flex-start;
    gap: 0.375rem;
    font-size: 0.75rem;
    color: #706e6b;
    background: #f3f2f2;
    padding: 0.5rem 0.625rem;
    border-radius: 4px;
    line-height: 1.5;
}

.drawer-actions {
    display: flex;
    gap: 0.5rem;
    padding: 1rem;
    border-top: 1px solid #e8e7e7;
    background: #fafaf9;
    flex-shrink: 0;
}


/* ============================================================
   Submit Confirmation Modal
   ============================================================ */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-container {
    background: #fff;
    border-radius: 8px;
    width: 500px;
    max-width: 92vw;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #dddbda;
}

.modal-close-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.2rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    color: #706e6b;
}

.modal-close-btn:hover {
    background: #f3f2f2;
}

.modal-body {
    padding: 1.25rem;
}

.preflight-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.625rem;
}

.preflight-item {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 0.625rem 0.75rem;
    border-radius: 6px;
    font-size: 0.875rem;
    line-height: 1.4;
}

.preflight-icon { flex-shrink: 0; margin-top: 0.1rem; }

.check-pass { background: #f0faf0; color: #1e6e1e; }
.check-fail { background: #fce8e8; color: var(--dxp-g-destructive); }
.check-warn { background: #fff8e1; color: #c05e00; }

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.875rem 1.25rem;
    border-top: 1px solid #dddbda;
    background: #fafaf9;
}


/* ===== Mockup-only scaffolding ===== */
[hidden] { display: none !important; }
body { margin: 0; background: var(--dxp-g-root); color: var(--dxp-g-root-contrast); font-family: var(--dxp-g-root-font-family); }
.mock-bar { display: flex; align-items: center; gap: 1rem; background: #032d60; color: #fff; padding: 0.5rem 1.25rem; font-size: 0.8125rem; }
.mock-bar label { display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; }
.mock-bar select { font-size: 0.8125rem; padding: 0.1rem 0.3rem; color: #181818; background: #fff; }
.toolbar-right { display: flex; align-items: center; }
.allocation-table.hide-avail .th-freeze-2, .allocation-table.hide-avail .td-freeze-2,
.allocation-table.hide-dist .th-freeze-3, .allocation-table.hide-dist .td-freeze-3 { display: none; }
.allocation-table.hide-avail .th-freeze-3, .allocation-table.hide-avail .td-freeze-3 { left: 230px; }                       /* Distributed slides left */
.allocation-table.hide-avail .th-freeze-4, .allocation-table.hide-avail .td-freeze-4,
.allocation-table.hide-dist  .th-freeze-4, .allocation-table.hide-dist  .td-freeze-4 { left: 318px; }                       /* Remaining follows whichever is left */
.allocation-table.hide-avail.hide-dist .th-freeze-4, .allocation-table.hide-avail.hide-dist .td-freeze-4 { left: 230px; }
#colMenu .slds-dropdown { min-width: 14rem; padding: .5rem .25rem; }
#colMenu .slds-checkbox { display: flex; padding: .35rem .75rem; }
#colMenu .slds-checkbox_faux { margin-right: .5rem; }
#colMenu .always { font-size: .6875rem; color: #706e6b; margin-left: .35rem; }
.footer-actions { align-items: center; }
/* Site Details drawer sits level with the table header, below the banner and toolbar */
.table-and-drawer { display: flex; align-items: stretch; min-height: 0; }
.table-and-drawer .table-scroll-container { flex: 1; min-width: 0; }
.table-and-drawer .site-drawer { border: 0 solid var(--dxp-g-neutral-1); border-radius: 4px; max-height: calc(100vh - 340px); min-height: 200px; }
.table-and-drawer .site-drawer.drawer-open { margin-left: var(--dxp-g-spacing-small); border-width: 1px; }
.site-drawer .drawer-body { min-height: 0; overflow-y: auto; }
.dev .appbar{padding:var(--dxp-g-spacing-small) var(--dxp-g-spacing-medium);border-bottom:1px solid var(--dxp-g-neutral-1);display:flex;align-items:center;gap:var(--dxp-g-spacing-xsmall);flex-shrink:0}
.dev .appbar .title{font-weight:600;font-size:1rem;flex:1;line-height:1.2}
.dev .appbar .sub{font-size:.6875rem;color:#706e6b;font-weight:400;display:block}
.dev .scroll{flex:1;overflow-y:auto;padding:var(--dxp-g-spacing-small) var(--dxp-g-spacing-medium)}
.dev .footer{border-top:1px solid var(--dxp-g-neutral-1);padding:var(--dxp-g-spacing-small) var(--dxp-g-spacing-medium);background:var(--dxp-g-root);flex-shrink:0}
.dev .footer .hint{font-size:.75rem;color:#706e6b;margin-bottom:var(--dxp-g-spacing-xsmall)}
.dev .footer .row{display:flex;gap:var(--dxp-g-spacing-xsmall)}
.dev .footer .row .slds-button{flex:1;justify-content:center}
.dev .seg{display:flex;border:1px solid var(--dxp-g-neutral-2);border-radius:6px;overflow:hidden;margin-bottom:var(--dxp-g-spacing-small)}
.dev .seg button{flex:1;border:0;background:var(--dxp-g-root);padding:.5rem;font-size:.875rem;color:var(--dxp-g-brand);cursor:pointer}
.dev .seg button.on{background:var(--dxp-g-brand);color:var(--dxp-g-brand-contrast)}
.dev .over{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;margin-bottom:var(--dxp-g-spacing-small);border-radius:4px;background:var(--dxp-g-destructive);color:var(--dxp-g-destructive-contrast);font-size:.8125rem}
.dev .over .slds-icon{fill:var(--dxp-g-destructive-contrast)}
.dev .over span{flex:1}

                            <div class="slds-checkbox"><input type="checkbox" checked disabled><label class="slds-checkbox__label"><span class="slds-checkbox_faux"></span><span class="slds-form-element__label">Remaining<span class="always">always shown</span></span></label></div>
                        </div>
                    </div>
                    <span class="slds-badge slds-m-right_x-small" id="hiddenCount" hidden></span>
                    <label class="slds-checkbox_toggle slds-grid slds-m-right_medium" id="hideConfirmedLabel">
                        <span class="slds-form-element__label slds-m-bottom_none">Hide Confirmed</span>

                    <tbody id="tbody"></tbody>

            <div class="site-drawer" id="drawer">

                <div class="drawer-body" id="drawerBody"></div>

            </div>

            <div class="table-footer">
                <span class="product-count" id="count"></span>
                <div class="page-size-picker"><span class="page-size-label">Per page:</span>
                    <select class="page-size-select"><option>25</option><option>50</option></select></div>
                <div class="pagination-controls"><button class="slds-button slds-button_icon" title="Previous page"><svg class="slds-button__icon" aria-hidden="true"><use href="#u-chevronleft"></use></svg></button><span class="page-label" id="pageLabel"></span><button class="slds-button slds-button_icon" title="Next page"><svg class="slds-button__icon" aria-hidden="true"><use href="#u-chevronright"></use></svg></button></div>
                <div class="footer-actions"><span class="slds-text-body_small slds-text-color_weak slds-align-middle slds-m-right_small" id="submitHint"></span><button class="slds-button slds-button_neutral" id="saveDraftBtn">Save Draft</button><button class="slds-button slds-button_brand" id="submitBtn">Submit Order</button></div>
            </div>
        </div>

    </div>

</div></div>

<div id="overModal" hidden>
    <section class="slds-modal slds-fade-in-open" role="alertdialog" aria-labelledby="overModalTitle" tabindex="-1">
        <div class="slds-modal__container">
            <header class="slds-modal__header slds-theme_error slds-theme_alert-texture">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" id="overModalX" title="Close"><svg class="slds-button__icon slds-button__icon_large" aria-hidden="true"><use href="#u-close"></use></svg></button>
                <h1 class="slds-modal__title slds-hyphenate" id="overModalTitle">Cannot submit order</h1>
            </header>
            <div class="slds-modal__content slds-p-around_medium"><p id="overModalText"></p></div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" id="overModalClose">Close</button>
                <button class="slds-button slds-button_destructive" id="overModalShow">Show Over Allocations</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</div>

<script>
// Based on Staging AllocReq-0025637 / PQ 250113-412412: real product names, ISBNs and programs (Amplify ELA, Burst, CKLA).
// Availability is real where the product had any; the rest, all site names and all quantities are mocked.
const PRODUCTS = [
    ['Amplify ELA G6 Student Consumable Set_NS','979-8-89512-646-2',39,'Amplify ELA'],
    ['Amplify ELA G7 Student Consumable Set','979-8-88699-582-4',37,'Amplify ELA'],
    ['Amplify ELA G8 Student Consumable Set','979-8-88699-583-1',41,'Amplify ELA'],
    ['Amplify ELA Student Text: A Raisin in the Sun','978-0-67975-533-3',60,'Amplify ELA'],
    ['Amplify ELA Trade Book G8: Narrative of the Life of Frederick Douglass','978-1-61700-762-0',60,'Amplify ELA'],
    ['Amplify ELA Uvl G6 Teacher Kit Box_NS','979-8-89512-648-6',15,'Amplify ELA'],
    ['Amplify ELA Uvl G7 Teacher Kit','978-1-63602-570-4',15,'Amplify ELA'],
    ['Amplify ELA Uvl G8 Teacher Kit','978-1-63602-571-1',15,'Amplify ELA'],
    ['Trade Book G6: Summer of the Mariposas','978-1-62014-010-9',60,'Amplify ELA'],
    ['Trade Book G8: Gris Grimly\'s Frankenstein','978-0-06186-298-4',60,'Amplify ELA'],
    ['mCLASS Intervention Kit Grades 4-6','978-1-95685-967-6',12,'Burst'],
    ['mCLASS Intervention Kit Grades K-3','978-1-95685-968-3',12,'Burst'],
    ['Amplify CKLA 3rd Ed G1 Knowledge Student Consumables Fairy Tales/Early Americas','979-8-89512-521-2',41,'CKLA'],
    ['Amplify CKLA 3rd Ed G1 Uvl Knowledge Classroom Kit Fairy Tales/Early Americas','979-8-89500-193-6',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G2 Knowledge Student Consumables Immigration/Nutrition','979-8-89512-544-1',37,'CKLA'],
    ['Amplify CKLA 3rd Ed G2 Uvl Knowledge Classroom Kit Immigration/Nutrition','979-8-89500-198-1',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G3 Student Consumable Set Charlotte\'s Web/Light and Sound','979-8-89500-319-0',40,'CKLA'],
    ['Amplify CKLA 3rd Ed G3 Uvl Complete Classroom Kit Charlotte\'s Web/Light & Sound','979-8-89500-161-5',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G4 Student Consumable Set Mixed-Up Files/Treasure Island','979-8-89500-322-0',40,'CKLA'],
    ['Amplify CKLA 3rd Ed G4 Uvl Integrated Classroom Kit Mixed-Up/Treasure Island','979-8-89500-164-6',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G5 Student Consumable Set Tollbooth/Renaissance','979-8-89500-326-8',35,'CKLA'],
    ['Amplify CKLA 3rd Ed G5 Uvl Integrated Classroom Kit Tollbooth/Renaissance','979-8-89500-168-4',20,'CKLA'],
    ['Amplify CKLA 3rd Ed GK Knowledge Student Consumables Presidents/Seasons','979-8-89512-507-6',38,'CKLA'],
    ['Amplify CKLA 3rd Ed GK Uvl Knowledge Classroom Kit Presidents/Seasons','979-8-89500-190-5',20,'CKLA']
].map(([name,isbn,available,program],i)=>({id:'p'+i,name,isbn,available,program}));
let sites = [
    {id:'s1',name:'Lincoln Elementary',status:'In Progress',editable:true,configured:true},
    {id:'s2',name:'Roosevelt Middle School',status:'Confirmed',editable:true,configured:true},
    {id:'s3',name:'Site 3',status:'In Progress',editable:true,configured:false},
];
const q = {"p0-s1": 12, "p0-s2": 10, "p0-s3": 4, "p1-s1": 21, "p1-s2": 20, "p2-s1": 12, "p2-s2": 10, "p4-s1": 18, "p4-s2": 15, "p5-s1": 4, "p5-s2": 4, "p5-s3": 2, "p6-s1": 4, "p6-s2": 4, "p8-s1": 18, "p8-s2": 15, "p9-s1": 18, "p9-s2": 15, "p10-s1": 4, "p10-s2": 3, "p10-s3": 1, "p12-s1": 12, "p12-s2": 10, "p13-s1": 6, "p13-s2": 5, "p14-s1": 11, "p14-s2": 9, "p16-s1": 12, "p16-s2": 10, "p17-s1": 6, "p17-s2": 5, "p18-s1": 12, "p18-s2": 10, "p20-s1": 10, "p20-s2": 9, "p20-s3": 4, "p21-s1": 6, "p21-s2": 5, "p22-s1": 11, "p22-s2": 10};
const ORIGINAL_STATUS = Object.fromEntries(sites.map(s=>[s.id,s.status]));
const badge = {New:'status-new','In Progress':'status-in-progress',Confirmed:'status-confirmed'};
const $ = id => document.getElementById(id);
const ico = (n,cls='') => `<svg class="slds-icon ${cls}" aria-hidden="true"><use href="#u-${n}"></use></svg>`;
const btnIco = (n,attrs,title) => `<button class="slds-button slds-button_icon slds-button_icon-x-small" ${attrs} title="${title}"><svg class="slds-button__icon" aria-hidden="true"><use href="#u-${n}"></use></svg></button>`;
const progSel = $('program');
[...new Set(PRODUCTS.map(p=>p.program))].forEach(v=>progSel.add(new Option(v,v)));
let activeId = null;
let locked = false;
let overOnly = false;
let hideConfirmed = false;
let hideAvail = false, hideDist = false;     // Remaining is deliberately not hideable
const isHidden = s => hideConfirmed && s.status === 'Confirmed';   // display only: every total still counts hidden sites
const distributed = p => sites.reduce((a,s)=>a+(q[p.id+'-'+s.id]||0),0);
const isOver = p => distributed(p) > p.available;
const overMessage = n => `<b>${n} ${n===1?'product is':'products are'} over-allocated.</b> Reduce quantities so the total assigned does not exceed what is available before you submit.`;
const ed = s => s.editable && !locked; // Amplify lock makes every site read-only

function maxFor(pid,sid){ const p=PRODUCTS.find(x=>x.id===pid); return Math.max(0,p.available-sites.filter(s=>s.id!==sid).reduce((a,s)=>a+(q[pid+'-'+s.id]||0),0)); }

function render(){
    const t=$('search').value.trim().toLowerCase(), pg=progSel.value;
    const shown=sites.filter(s=>!isHidden(s)), hiddenN=sites.length-shown.length;
    const confirmedN=sites.filter(s=>s.status==='Confirmed').length;
    $('hideConfirmed').disabled=!confirmedN&&!hideConfirmed;
    $('hiddenCount').hidden=!hiddenN; $('hiddenCount').textContent=`${hiddenN} hidden`;
    const overCount=PRODUCTS.filter(isOver).length;
    if(!overCount) overOnly=false;                       // nothing left to filter to
    const rows=PRODUCTS.filter(p=>(!overOnly||isOver(p))&&(!pg||p.program===pg)&&(!t||p.name.toLowerCase().includes(t)||(p.isbn||'').toLowerCase().includes(t)));
    $('overBanner').hidden=!overCount;
    $('overText').innerHTML=overMessage(overCount);
    $('overToggle').textContent=overOnly?'Show All Products':'Show Over Allocations';
    
    $('thead').innerHTML=`
    <tr class="site-header-row">
        <th class="col-product th-freeze-1" rowspan="2">Product</th><th class="col-number th-freeze-2" rowspan="2">Available</th>
        <th class="col-number th-freeze-3" rowspan="2">Distributed</th><th class="col-number th-freeze-4 col-remaining-header" rowspan="2">Remaining</th>
        ${shown.map(s=>`<th class="site-th${s.id===activeId?' site-th-active':''}"><div class="site-header-content">
            <div class="site-name-row"><button class="site-name-btn" data-site="${s.id}">${s.name}</button>${s.configured?`<span title="Site configured">${ico('check','slds-icon_xx-small slds-icon-text-success')}</span>`:`<span title="Missing shipping address">${ico('warning','slds-icon_xx-small slds-icon-text-warning')}</span>`}</div>
            <div class="site-controls"><span class="status-badge ${badge[s.status]}">${s.status}</span>
                ${btnIco('settings',`data-site="${s.id}"`,'Configure site details')}
                ${ed(s)?btnIco('refresh',`data-clear="${s.id}"`,'Clear all quantities for this site')+btnIco('delete',`data-remove="${s.id}"`,'Remove this site'):''}
            </div></div></th>`).join('')}
    </tr>
    <tr class="col-label-row">${shown.map(()=>'<th class="col-assigned-label">Assigned</th>').join('')}</tr>`;
    $('tbody').innerHTML=rows.map(p=>{
        const dist=sites.reduce((a,s)=>a+(q[p.id+'-'+s.id]||0),0), rem=p.available-dist, over=rem<0;
        return `<tr class="product-row">
        <td class="col-product td-freeze-1"><div class="product-name">${p.name}</div><div class="product-meta-row"><span class="product-program-label">${p.program}</span>${p.isbn?`<span class="product-isbn-inline">${p.isbn}</span>`:''}</div></td>
        <td class="col-number td-freeze-2">${p.available}</td><td class="col-number td-freeze-3">${dist}</td>
        <td class="col-number td-freeze-4${over?' remaining-error':''}">${over?`<span class="icon-over-allocated" title="Over-allocated">${ico('warning','slds-icon_xx-small slds-icon-text-error')}</span>`:''}${rem}</td>
        ${shown.map(s=>{const v=q[p.id+'-'+s.id]||0; return `<td class="col-input"><div class="input-cell">`+
            (ed(s)?`<button class="qty-btn" data-dec="${p.id}|${s.id}">−</button><input type="number" min="0" class="qty-input${over?' qty-error':''}" value="${v}" data-p="${p.id}" data-s="${s.id}"><button class="qty-btn" data-inc="${p.id}|${s.id}">+</button>`
                       :`<input type="number" class="qty-input qty-disabled" value="${v}" disabled>`)+`</div></td>`;}).join('')}
        </tr>`;}).join('');
    const tbl=document.querySelector('.allocation-table');
    tbl.classList.toggle('hide-avail',hideAvail); tbl.classList.toggle('hide-dist',hideDist);
    const nHiddenCols=(hideAvail?1:0)+(hideDist?1:0); $('colBtn').textContent=nHiddenCols?`Columns · ${nHiddenCols} hidden`:'Columns';
    const reason=$('lockReason').value;
    $('lockBanner').hidden=!locked;
    $('lockBanner').innerHTML=`<span class="slds-icon_container slds-m-right_x-small">${ico('lock','slds-icon_x-small slds-icon-text-default')}</span><h2><b>${reason}.</b> Amplify is updating this order, so quantities and site details are read-only for now.</h2>`;
    const unconfirmedN=sites.filter(s=>s.status!=='Confirmed').length;
    $('addSite').disabled=locked; $('saveDraftBtn').disabled=locked;
    $('submitBtn').disabled=locked||unconfirmedN>0;                       // Submit needs every allocation Confirmed
    $('submitHint').textContent=(!locked&&unconfirmedN)?`${unconfirmedN} ${unconfirmedN===1?'allocation is':'allocations are'} not confirmed`:'';
    $('submitBtn').title=unconfirmedN?'Confirm all allocations before submitting':'';
    $('count').textContent=`1–${rows.length} of ${rows.length} products${overOnly?' (over-allocated only)':''}`; $('pageLabel').textContent='Page 1 of 1';
    if (typeof dv !== 'undefined' && dv.layout !== 'desktop') renderDevice();
}

function renderDrawer(){
    const s=sites.find(x=>x.id===activeId&&!isHidden(x)); $('managerBody').classList.toggle('drawer-is-open',!!s); $('drawer').classList.toggle('drawer-open',!!s);
    if(!s){ $('drawerBody').innerHTML=''; return; }
    const f=(l,ph='',type='text',v='')=>`<div class="slds-form-element"><label class="slds-form-element__label">${l}</label><div class="slds-form-element__control"><input class="slds-input" type="${type}" placeholder="${ph}" value="${v}"></div></div>`;
    const sel=(l,opts)=>`<div class="slds-form-element"><label class="slds-form-element__label">${l}</label><div class="slds-form-element__control"><div class="slds-select_container"><select class="slds-select">${opts.map(o=>`<option>${o}</option>`).join('')}</select></div></div></div>`;
    $('drawerBody').innerHTML=`
    <div class="drawer-section">${f('Display Name','e.g., Lincoln Elementary','text',s.name)}${sel('Shipping Address',['Select a shipping address...','Lincoln Elementary — 123 Main St, Springfield, IL 62701'])}</div>
    <div class="drawer-section"><h4 class="drawer-section-title">Delivery Contact</h4>${sel('Ship To Contact',['Select a contact...','Sarah Johnson'])}${f('Phone','217-555-0101','tel')}</div>
    <div class="drawer-section"><h4 class="drawer-section-title">Delay Delivery</h4><p class="drawer-section-hint">Enter a date if delivery should not begin before a specific date.</p>${f('Do Not Deliver Before','','date')}</div>
    <div class="drawer-section"><h4 class="drawer-section-title">Dates You Cannot Accept Delivery</h4><p class="drawer-section-hint">Enter up to 7 consecutive unavailable dates. US holidays are automatically excluded.</p>${f('Blackout Start Date','','date')}${f('Blackout End Date','','date')}</div>
    <div class="drawer-section"><h4 class="drawer-section-title">Proof of Delivery</h4><p class="drawer-section-hint">If this delivery must be confirmed within your fiscal year, provide the fiscal year end date.</p>${f('Fiscal Year End Date','','date')}</div>
    <div class="drawer-section"><h4 class="drawer-section-title">Room of Choice</h4><p class="drawer-section-hint">If your delivery service includes room-of-choice delivery, specify the destination room.</p>${f('Room Name','e.g., Library, Room 204')}${f('Floor Number','','number')}</div>
    <div class="drawer-actions"><button class="slds-button slds-button_brand" id="saveDrawer">Save</button><button class="slds-button slds-button_neutral" id="cancelDrawer">Cancel</button></div>`;
    if(locked){ $('drawerBody').querySelectorAll('input,select').forEach(i=>i.disabled=true); $('saveDrawer').remove(); $('cancelDrawer').textContent='Close'; }
    const closeDrawer=()=>{activeId=null;render();renderDrawer();};
    if($('saveDrawer')) $('saveDrawer').onclick=closeDrawer;
    $('cancelDrawer').onclick=closeDrawer;
}

document.addEventListener('click',e=>{
    const d=e.target.closest('[data-site],[data-clear],[data-remove],[data-inc],[data-dec]'); if(!d) return;
    const ds=d.dataset;
    if(ds.site){ activeId=ds.site; render(); renderDrawer(); }
    else if(ds.clear){ PRODUCTS.forEach(p=>delete q[p.id+'-'+ds.clear]); render(); }
    else if(ds.remove){ sites=sites.filter(s=>s.id!==ds.remove); if(activeId===ds.remove) activeId=null; render(); renderDrawer(); }
    else { const [pid,sid]=(ds.inc||ds.dec).split('|'), k=pid+'-'+sid, cur=q[k]||0;
        if(ds.inc){ if(cur<maxFor(pid,sid)) q[k]=cur+1; } else if(cur>0) q[k]=cur-1; render(); }
});
document.addEventListener('change',e=>{ const i=e.target.closest('input[data-p]'); if(!i) return; q[i.dataset.p+'-'+i.dataset.s]=Math.max(0,parseFloat(i.value)||0); render(); });
$('search').addEventListener('input',render); progSel.addEventListener('change',render); $('closeDrawer').onclick=()=>{activeId=null;render();renderDrawer();};
$('hideConfirmed').addEventListener('change',e=>{ hideConfirmed=e.target.checked; if(activeId&&isHidden(sites.find(x=>x.id===activeId)||{})) activeId=null; render(); renderDrawer(); });
$('colBtn').addEventListener('click',e=>{ e.stopPropagation(); const open=!$('colMenu').classList.contains('slds-is-open'); $('colMenu').classList.toggle('slds-is-open',open); $('colBtn').setAttribute('aria-expanded',open); });
document.addEventListener('click',e=>{ if(!e.target.closest('#colMenu')){ $('colMenu').classList.remove('slds-is-open'); $('colBtn').setAttribute('aria-expanded','false'); } });
$('colAvail').addEventListener('change',e=>{ hideAvail=!e.target.checked; render(); });
$('colDist').addEventListener('change',e=>{ hideDist=!e.target.checked; render(); });
$('overToggle').addEventListener('click',()=>{ overOnly=!overOnly; render(); });
const closeOverModal=()=>{ $('overModal').hidden=true; };
$('submitBtn').addEventListener('click',()=>{
    const n=PRODUCTS.filter(isOver).length;
    if(!n) return;                                   // no error: the normal submit confirmation would open here
    $('overModalText').innerHTML=overMessage(n); $('overModal').hidden=false;
});
$('overModalShow').addEventListener('click',()=>{ overOnly=true; closeOverModal(); render(); $('overBanner').scrollIntoView({block:'nearest'}); });
$('overModalClose').addEventListener('click',closeOverModal); $('overModalX').addEventListener('click',closeOverModal);
$('overModal').addEventListener('click',e=>{ if(e.target.matches('.slds-modal, .slds-backdrop')) closeOverModal(); });
$('lockToggle').addEventListener('change',e=>{ locked=e.target.checked; render(); renderDrawer(); });
$('lockReason').addEventListener('change',render);
$('confirmAll').addEventListener('change',e=>{ sites.forEach(s=>{ s.status=e.target.checked?'Confirmed':(ORIGINAL_STATUS[s.id]||'In Progress'); }); render(); renderDrawer(); });
let n=4; $('addSite').onclick=()=>{ const id='s'+n; sites.push({id,name:'Site '+n,status:'In Progress',editable:true,configured:false}); n++; activeId=id; render(); renderDrawer(); };  // new site opens straight into Site Details

// ============================================================
// Device layouts (Tablet / Mobile). Same data and state as the desktop table.
// ============================================================
const dv = { orient: 'portrait', layout: 'desktop', menu: false, site: 's1', mode: 'site', search: '', prog: '', open: new Set(), sheet: null };
const dSplit = () => dv.layout === 'tablet' || dv.orient === 'landscape';   // phone in landscape uses the split layout too
const dEd = s => s.editable && !locked;
const dLeft = p => p.available - distributed(p);
const dUnconf = () => sites.filter(s => s.status !== 'Confirmed').length;
const dSite = () => sites.find(x => x.id === dv.site) || sites[0];
const dFiltered = () => PRODUCTS.filter(p => (!overOnly || isOver(p)) && (!dv.prog || p.program === dv.prog) && (!dv.search || p.name.toLowerCase().includes(dv.search)));
const dTotal = sid => PRODUCTS.reduce((a, p) => a + (q[p.id + '-' + sid] || 0), 0);
const dDot = s => `<span class="dot ${s.status === 'Confirmed' ? 'ok' : ''}"></span>`;
const dBadge = s => `<span class="badge ${s.status === 'Confirmed' ? 'b-conf' : 'b-prog'}">${s.status}</span>`;
const dStepper = (p, s, err) => { const e = dEd(s), dis = e ? '' : 'disabled'; return `<div class="stepper"><button data-d-dec="${p.id}|${s.id}" ${dis} aria-label="Decrease">−</button><input type="number" inputmode="numeric" class="${err ? 'err' : ''}" value="${q[p.id + '-' + s.id] || 0}" data-d-in="${p.id}|${s.id}" ${dis}><button data-d-inc="${p.id}|${s.id}" ${dis} aria-label="Increase">+</button></div>`; };
const dAlerts = () => {
    const n = PRODUCTS.filter(isOver).length;
    const lock = locked ? `<div class="lockb">${ico('lock', 'slds-icon_x-small slds-icon-text-default')}<span><b>${$('lockReason').value}.</b> Amplify is updating this order, so quantities and site details are read-only for now.</span></div>` : '';
    const over = n ? `<div class="over">${ico('warning', 'slds-icon_x-small')}<span><b>${n} product${n > 1 ? 's are' : ' is'} over-allocated.</b></span><button class="slds-button slds-button_neutral" data-d-overtoggle>${overOnly ? 'Show all' : 'Show'}</button></div>` : '';
    return lock + over;
};
const dAppbar = sub => `<div class="appbar"><button class="slds-button slds-button_icon" aria-label="Back"><svg class="slds-button__icon" aria-hidden="true"><use href="#u-chevronleft"></use></svg></button><div class="title">PQ 250113-412412<span class="sub">${sub}</span></div><span class="badge" style="background:#e3f0ff;color:var(--dxp-g-brand)">Open</span></div>`;
const dFooter = () => { const u = dUnconf(), off = locked || u > 0; return `<div class="footer">${(!locked && u) ? `<div class="hint">${u} ${u === 1 ? 'allocation is' : 'allocations are'} not confirmed</div>` : ''}<div class="row"><button class="slds-button slds-button_neutral" ${locked ? 'disabled' : ''}>Save Draft</button><button class="slds-button slds-button_brand" data-d-submit ${off ? 'disabled' : ''}>Submit Order</button></div></div>`; };
const dSiteCard = s => `<div class="sitecard"><div style="display:flex;justify-content:space-between;align-items:center"><span class="name">${s.name}</span>${dBadge(s)}</div>
    <div class="meta">${s.configured ? '123 Main St, Springfield, IL · Sarah Johnson' : ico('warning', 'slds-icon_xx-small slds-icon-text-warning') + ' Missing shipping address'}</div>
    <button class="slds-button slds-button_neutral" data-d-sheet="${s.id}">${ico('settings', 'slds-button__icon')} ${locked ? 'View site details' : 'Edit site details'}</button>
    <div class="totals"><span><b>${dTotal(s.id)}</b> units</span><span><b>${PRODUCTS.filter(p => (q[p.id + '-' + s.id] || 0) > 0).length}</b> of ${PRODUCTS.length} products</span></div></div>`;
const dTools = () => `<div class="${dv.layout === 'tablet' ? 'tablet-tools' : 'tools'}"><div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left">${ico('search', 'slds-input__icon slds-input__icon_left slds-icon-text-default')}<input class="slds-input" data-d-search placeholder="Search products" value="${dv.search}"></div>
    <div class="slds-select_container"><select class="slds-select" data-d-prog><option value="">All Programs</option>${[...new Set(PRODUCTS.map(p => p.program))].map(x => `<option ${dv.prog === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>`;
const dSheet = () => {
    const s = sites.find(x => x.id === dv.sheet); if (!s) return '';
    const dis = locked ? 'disabled' : '';
    const f = (l, v = '', t = 'text') => `<div class="slds-form-element"><label class="slds-form-element__label">${l}</label><div class="slds-form-element__control"><input class="slds-input" type="${t}" value="${v}" ${dis}></div></div>`;
    const sel = (l, o) => `<div class="slds-form-element"><label class="slds-form-element__label">${l}</label><div class="slds-form-element__control"><div class="slds-select_container"><select class="slds-select" ${dis}>${o.map(x => `<option>${x}</option>`).join('')}</select></div></div></div>`;
    return `${dSplit() ? '<div class="scrim" data-d-close></div>' : ''}<div class="sheet"><div class="appbar"><button class="slds-button slds-button_icon" data-d-close aria-label="Close"><svg class="slds-button__icon" aria-hidden="true"><use href="#u-close"></use></svg></button><div class="title">Site Details<span class="sub">${s.name}</span></div>${dBadge(s)}</div>
    <div class="scroll form">${f('Display Name', s.name)}${sel('Shipping Address', ['Lincoln Elementary — 123 Main St, Springfield, IL 62701'])}
    <div class="sec">Delivery contact</div>${sel('Ship To Contact', ['Sarah Johnson'])}${f('Phone', '217-555-0101', 'tel')}
    <div class="sec">Delay delivery</div><p class="hintp">Enter a date if delivery should not begin before a specific date.</p>${f('Do Not Deliver Before', '', 'date')}
    <div class="sec">Dates you cannot accept delivery</div><p class="hintp">Up to 7 consecutive dates. US holidays are excluded automatically.</p>${f('Blackout Start Date', '', 'date')}${f('Blackout End Date', '', 'date')}
    <div class="sec">Proof of delivery</div>${f('Fiscal Year End Date', '', 'date')}
    <div class="sec">Room of choice</div>${f('Room Name', '')}${f('Floor Number', '', 'number')}</div>
    <div class="footer"><div class="row">${locked ? '<button class="slds-button slds-button_neutral" data-d-close>Close</button>' : `<button class="slds-button slds-button_neutral" data-d-close>Save</button>${s.status !== 'Confirmed' ? `<button class="slds-button slds-button_brand" data-d-confirm="${s.id}">Confirm</button>` : ''}`}</div></div></div>`;
};
function dMobile() {
    const s = dSite(), rows = dFiltered();
    const menu = dv.menu ? `<div class="menu" role="listbox">${sites.length > 8 ? '<div class="msearch"><input class="slds-input" placeholder="Find a site"></div>' : ''}${sites.map(x => `<div class="mitem ${x.id === dv.site ? 'on' : ''}" role="option" data-d-site="${x.id}">${dDot(x)}<span class="nm">${x.name}<span class="sub">${x.status}${x.configured ? '' : ' · missing address'}</span></span><span class="u">${dTotal(x.id)} units</span>${x.id === dv.site ? ico('check', 'slds-icon_x-small slds-icon-text-success') : ''}</div>`).join('')}${locked ? '' : `<div class="mitem" data-d-add>${ico('add', 'slds-icon_x-small slds-icon-text-default')}<span class="nm">Add site</span></div>`}</div>` : '';
    const body = dv.mode === 'site'
        ? `<div class="sitepick"><button class="pickbtn" data-d-menu aria-haspopup="listbox" aria-expanded="${dv.menu}">${dDot(s)}<span class="nm">${s.name}</span><span class="of">${sites.indexOf(s) + 1} of ${sites.length}</span>${ico('chevrondown', 'slds-icon_x-small slds-icon-text-default')}</button>${menu}</div>${dSiteCard(s)}${dTools()}
           ${rows.map(p => `<div class="prow"><div class="info"><div class="pname">${p.name}</div><div class="pmeta">${p.program} · ${p.isbn}</div><div class="left ${dLeft(p) < 0 ? 'neg' : ''}">${dLeft(p) < 0 ? 'Over by ' + (-dLeft(p)) : dLeft(p) + ' left of ' + p.available}</div></div>${dStepper(p, s, isOver(p))}</div>`).join('') || '<p class="hintp">No products match.</p>'}`
        : dFiltered().map(p => { const d = distributed(p), open = dv.open.has(p.id), pct = Math.min(100, 100 * d / Math.max(1, p.available)); return `<div class="pcard ${isOver(p) ? 'err' : ''}"><div class="phead" data-d-open="${p.id}"><div class="info"><div class="pname">${p.name}</div><div class="left ${isOver(p) ? 'neg' : ''}">${isOver(p) ? 'Over by ' + (-dLeft(p)) : d + ' of ' + p.available + ' assigned'}</div><div class="bar ${isOver(p) ? 'err' : ''}"><i style="width:${pct}%"></i></div></div><svg class="slds-icon slds-icon_x-small slds-icon-text-default" style="${open ? 'transform:rotate(180deg)' : ''}"><use href="#u-chevrondown"></use></svg></div>${open ? `<div class="pbody">${sites.map(x => `<div class="srow"><span class="sn">${x.name}${x.status === 'Confirmed' ? ' <span class="badge b-conf">Confirmed</span>' : ''}</span>${dStepper(p, x, isOver(p))}</div>`).join('')}</div>` : ''}</div>`; }).join('');
    return `${dAppbar('Customer Quote Q-507564')}<div class="scroll">${dAlerts()}<div class="seg"><button data-d-mode="site" class="${dv.mode === 'site' ? 'on' : ''}">By site</button><button data-d-mode="product" class="${dv.mode === 'product' ? 'on' : ''}">By product</button></div>${body}</div>${dFooter()}${dSheet()}`;
}
function dTablet() {
    const s = dSite(), rows = dFiltered();
    const rail = `<div class="rail"><div class="rh">Sites (${sites.length})</div>${sites.map(x => `<div class="ritem ${x.id === dv.site ? 'on' : ''}" data-d-site="${x.id}">${dDot(x)}<span class="nm">${x.name}<span class="sub">${x.status}${x.configured ? '' : ' · missing address'}</span></span><span class="u">${dTotal(x.id)}</span></div>`).join('')}${locked ? '' : `<button class="slds-button slds-button_neutral radd" data-d-add>+ Add Site</button>`}</div>`;
    const pane = `<div class="pane"><div class="scroll">${dSiteCard(s)}${dTools()}
        <div class="tgrid thead"><span>Product</span><span style="text-align:right">Available</span><span style="text-align:right">Left</span><span style="text-align:center">Assigned</span></div>
        ${rows.map(p => `<div class="tgrid trow"><div><div class="pname">${p.name}</div><div class="pmeta">${p.program} · ${p.isbn}</div></div><span class="num">${p.available}</span><span class="num ${dLeft(p) < 0 ? 'neg' : ''}">${dLeft(p)}</span>${dStepper(p, s, isOver(p))}</div>`).join('') || '<p class="hintp">No products match.</p>'}</div></div>`;
    return `${dAppbar('Customer Quote Q-507564 · Amplify ELA, Burst, CKLA')}<div style="padding:var(--dxp-g-spacing-small) var(--dxp-g-spacing-medium) 0">${dAlerts()}</div><div class="split">${rail}${pane}</div>${dFooter()}${dSheet()}`;
}
function renderDevice() {
    if (dv.layout === 'desktop') return;
    $('dev').innerHTML = dSplit() ? dTablet() : dMobile();
}
function setLayout(l) {
    dv.layout = l; dv.menu = false; dv.sheet = null;
    const device = l !== 'desktop';
    $('desktopPage').hidden = device; $('deviceWrap').hidden = !device; document.body.classList.toggle('device', device);
    $('devFrame').className = 'dev-frame ' + (l === 'tablet' ? 'tablet ' : 'mobile ') + dv.orient;
    $('orientSeg').hidden = !device; $('fitLabel').hidden = !device;
    document.querySelectorAll('#layoutSeg button').forEach(b => b.classList.toggle('on', b.dataset.layout === l));
    if (!dv.open.size) { const o = PRODUCTS.find(isOver); if (o) dv.open.add(o.id); }
    render(); fitDevice();
}
// Scale the device frame down to fit the preview window (CSS zoom keeps layout and text crisp)
function fitDevice() {
    const f = $('devFrame'); if (!f || dv.layout === 'desktop') return;
    f.style.zoom = 1;
    if (!$('fitToggle').checked) return;
    const w = f.offsetWidth, h = f.offsetHeight, barH = document.querySelector('.mock-bar').offsetHeight;
    f.style.zoom = Math.min(1, (window.innerWidth - 48) / w, (window.innerHeight - barH - 48) / h);
}
window.addEventListener('resize', fitDevice);
$('fitToggle').addEventListener('change', fitDevice);
$('orientSeg').addEventListener('click', e => { const b = e.target.closest('[data-orient]'); if (!b) return; dv.orient = b.dataset.orient; dv.sheet = null; document.querySelectorAll('#orientSeg button').forEach(x => x.classList.toggle('on', x === b)); setLayout(dv.layout); });
const dAttr = (t, n) => t.hasAttribute('data-d-' + n) ? t.getAttribute('data-d-' + n) : null;
$('layoutSeg').addEventListener('click', e => { const b = e.target.closest('[data-layout]'); if (b) setLayout(b.dataset.layout); });
$('dev').addEventListener('click', e => {
    const t = e.target.closest('[data-d-inc],[data-d-dec],[data-d-site],[data-d-open],[data-d-overtoggle],[data-d-sheet],[data-d-menu],[data-d-mode],[data-d-add],[data-d-close],[data-d-confirm],[data-d-submit]');
    if (!t) { if (dv.menu && !e.target.closest('.menu')) { dv.menu = false; renderDevice(); } return; }
    let v;
    if ((v = dAttr(t, 'menu')) !== null) { dv.menu = !dv.menu; renderDevice(); return; }
    if ((v = dAttr(t, 'site')) !== null) { dv.site = v; dv.menu = false; }
    else if ((v = dAttr(t, 'mode')) !== null) dv.mode = v;
    else if ((v = dAttr(t, 'open')) !== null) { dv.open.has(v) ? dv.open.delete(v) : dv.open.add(v); }
    else if (dAttr(t, 'overtoggle') !== null) overOnly = !overOnly;
    else if ((v = dAttr(t, 'sheet')) !== null) dv.sheet = v;
    else if (dAttr(t, 'close') !== null) dv.sheet = null;
    else if ((v = dAttr(t, 'confirm')) !== null) { const s = sites.find(x => x.id === v); if (s) s.status = 'Confirmed'; dv.sheet = null; }
    else if (dAttr(t, 'add') !== null) { const id = 's' + n; sites.push({ id, name: 'Site ' + n, status: 'In Progress', editable: true, configured: false }); n++; dv.site = id; dv.sheet = id; dv.menu = false; }
    else if (dAttr(t, 'submit') !== null) { const k = PRODUCTS.filter(isOver).length; if (k) { $('overModalText').innerHTML = overMessage(k); $('overModal').hidden = false; } return; }
    else if ((v = dAttr(t, 'inc')) !== null || (v = dAttr(t, 'dec')) !== null) {
        const [pid, sid] = v.split('|'), key = pid + '-' + sid, cur = q[key] || 0;
        if (dAttr(t, 'inc') !== null) { if (cur < maxFor(pid, sid)) q[key] = cur + 1; } else if (cur > 0) q[key] = cur - 1;
    }
    render();
});
$('dev').addEventListener('change', e => {
    if (e.target.matches('[data-d-in]')) { const [pid, sid] = e.target.getAttribute('data-d-in').split('|'); q[pid + '-' + sid] = Math.max(0, parseFloat(e.target.value) || 0); render(); }
    else if (e.target.matches('[data-d-prog]')) { dv.prog = e.target.value; render(); }
});
$('dev').addEventListener('input', e => {
    if (!e.target.matches('[data-d-search]')) return;
    dv.search = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; render();
    const el = document.querySelector('#dev [data-d-search]'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
});

render(); renderDrawer();
</script>
</body>
