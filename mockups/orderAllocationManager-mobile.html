<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Allocation Manager — Mobile Mockup</title>
<link rel="stylesheet" href="assets/site-styles/salesforce-lightning-design-system.min.css">
<link rel="stylesheet" href="assets/site-styles/dxp-site-spacing-styling-hooks.min.css">
<link rel="stylesheet" href="assets/site-styles/dxp-styling-hooks.min.css">
<link rel="stylesheet" href="assets/site-styles/site-theme.css">
<link rel="stylesheet" href="assets/site-styles/dxp-slds-extensions.min.css">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:#e9ecf1;font-family:var(--dxp-g-root-font-family);color:var(--dxp-g-root-contrast)}
.mock-bar{background:#032d60;color:#fff;padding:.5rem 1.25rem;font-size:.8125rem}
.stage{display:flex;gap:2rem;justify-content:center;align-items:flex-start;padding:1.5rem;flex-wrap:wrap}
.caption{text-align:center;font-size:.8125rem;font-weight:600;margin-bottom:.5rem;color:#444}
.phone{width:390px;height:790px;border:10px solid #1b1b1b;border-radius:34px;background:var(--dxp-g-root);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.appbar{padding:var(--dxp-g-spacing-small) var(--dxp-g-spacing-medium);border-bottom:1px solid var(--dxp-g-neutral-1);display:flex;align-items:center;gap:var(--dxp-g-spacing-xsmall);flex-shrink:0}
.appbar .title{font-weight:600;font-size:1rem;flex:1;line-height:1.2}
.appbar .sub{font-size:.6875rem;color:#706e6b;font-weight:400;display:block}
.scroll{flex:1;overflow-y:auto;padding:var(--dxp-g-spacing-small) var(--dxp-g-spacing-medium)}
.footer{border-top:1px solid var(--dxp-g-neutral-1);padding:var(--dxp-g-spacing-small) var(--dxp-g-spacing-medium);background:var(--dxp-g-root);flex-shrink:0}
.footer .hint{font-size:.75rem;color:#706e6b;margin-bottom:var(--dxp-g-spacing-xsmall)}
.footer .row{display:flex;gap:var(--dxp-g-spacing-xsmall)}.footer .row .slds-button{flex:1;justify-content:center}
.seg{display:flex;border:1px solid var(--dxp-g-neutral-2);border-radius:6px;overflow:hidden;margin-bottom:var(--dxp-g-spacing-small)}
.seg button{flex:1;border:0;background:var(--dxp-g-root);padding:.5rem;font-size:.875rem;color:var(--dxp-g-brand);cursor:pointer}
.seg button.on{background:var(--dxp-g-brand);color:var(--dxp-g-brand-contrast)}
.over{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;margin-bottom:var(--dxp-g-spacing-small);border-radius:4px;background:var(--dxp-g-destructive);color:var(--dxp-g-destructive-contrast);font-size:.8125rem}
.over .slds-icon{fill:var(--dxp-g-destructive-contrast)}.over span{flex:1}
.over .slds-button{padding:0 .6rem;line-height:1.75rem;font-size:.75rem}
.sitepick{position:relative;margin-bottom:var(--dxp-g-spacing-small)}
.pickbtn{width:100%;display:flex;align-items:center;gap:.6rem;min-height:48px;padding:.5rem .75rem;border:1px solid var(--dxp-g-neutral-2);border-radius:6px;background:var(--dxp-g-root);font-size:1rem;color:var(--dxp-g-root-contrast);cursor:pointer;text-align:left}
.pickbtn[aria-expanded=true]{border-color:var(--dxp-g-brand);box-shadow:0 0 0 1px var(--dxp-g-brand)}
.pickbtn .nm{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn .of{font-size:.75rem;color:#706e6b}
.pickbtn svg{transition:transform .15s}.pickbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--dxp-g-root);border:1px solid var(--dxp-g-neutral-2);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-height:300px;overflow-y:auto}
.msearch{padding:.5rem;border-bottom:1px solid var(--dxp-g-neutral-1);position:sticky;top:0;background:var(--dxp-g-root)}
.mitem{display:flex;align-items:center;gap:.6rem;padding:.65rem .75rem;min-height:48px;border-bottom:1px solid var(--dxp-g-neutral-1);cursor:pointer}
.mitem:last-child{border-bottom:0}.mitem:active,.mitem.on{background:var(--dxp-g-neutral)}
.mitem .nm{flex:1;font-size:.9375rem;min-width:0}.mitem .sub{display:block;font-size:.6875rem;color:#706e6b}
.mitem .u{font-size:.75rem;color:#444}
.dot{flex:none;width:.625rem;height:.625rem;border-radius:50%;background:#e65100}.dot.ok{background:#2e844a}
.sitecard{border:1px solid var(--dxp-g-neutral-1);border-radius:6px;padding:.75rem;margin:.25rem 0 var(--dxp-g-spacing-small);background:var(--dxp-g-neutral)}
.sitecard .name{font-weight:600}.sitecard .meta{font-size:.75rem;color:#706e6b;margin:.15rem 0 .5rem}
.sitecard .totals{display:flex;gap:1rem;font-size:.75rem;color:#444;margin-top:.5rem}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.6875rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.b-prog{background:#fff3e0;color:#e65100}.b-conf{background:#efe8fc;color:#5c35cc}
.tools{display:flex;gap:.5rem;margin-bottom:var(--dxp-g-spacing-small)}.tools>*{flex:1}
.prow{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--dxp-g-neutral-1)}
.prow .info{flex:1;min-width:0}.prow .pname{font-size:.875rem;font-weight:500;line-height:1.25}
.prow .pmeta{font-size:.6875rem;color:#8a8886;margin-top:.15rem}
.left{font-size:.6875rem;margin-top:.2rem;color:#706e6b}.left.neg{color:var(--dxp-g-destructive);font-weight:700}
.stepper{display:flex;align-items:center;gap:.25rem;flex-shrink:0}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--dxp-g-neutral-2);background:var(--dxp-g-root);font-size:1.25rem;line-height:1;cursor:pointer;color:var(--dxp-g-root-contrast)}
.stepper button:active{background:var(--dxp-g-neutral)}
.stepper input{width:52px;height:40px;text-align:center;border:1px solid var(--dxp-g-neutral-2);border-radius:4px;font-size:1rem}
.stepper input.err{border-color:var(--dxp-g-destructive);background:#fff8f8}
.pcard{border:1px solid var(--dxp-g-neutral-1);border-radius:6px;margin-bottom:.5rem;overflow:hidden}
.pcard.err{border-color:var(--dxp-g-destructive)}
.phead{padding:.75rem;display:flex;align-items:center;gap:.5rem;cursor:pointer}
.phead .info{flex:1;min-width:0}.bar{height:6px;border-radius:3px;background:var(--dxp-g-neutral-1);margin-top:.4rem;overflow:hidden}.bar>i{display:block;height:100%;background:var(--dxp-g-brand)}.bar.err>i{background:var(--dxp-g-destructive)}
.pbody{border-top:1px solid var(--dxp-g-neutral-1);background:var(--dxp-g-neutral);padding:0 .75rem}
.srow{display:flex;align-items:center;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--dxp-g-neutral-1)}.srow:last-child{border-bottom:0}.srow .sn{flex:1;font-size:.8125rem}
.form .slds-form-element{margin-bottom:var(--dxp-g-spacing-small)}
.sec{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#444;margin:var(--dxp-g-spacing-medium) 0 .25rem}
.hintp{font-size:.75rem;color:#706e6b;margin:0 0 .5rem}
.sitecard .slds-button__icon{margin-right:.35rem;width:.875rem;height:.875rem}
</style>
</head>
<body>

<symbol viewBox="0 0 520 520"  id="u-check" xmlns="http://www.w3.org/2000/svg"><path d="M191 425L26 259c-6-6-6-16 0-22l22-22c6-6 16-6 22 0l124 125a10 10 0 0015 0L452 95c6-6 16-6 22 0l22 22c6 6 6 16 0 22L213 425c-6 7-16 7-22 0"/></symbol>
<symbol viewBox="0 0 520 520"  id="u-settings" xmlns="http://www.w3.org/2000/svg"><path d="M261 191c-39 0-70 31-70 70s31 70 70 70 70-31 70-70-31-70-70-70m210 133l-37-31a195 195 0 000-68l37-31c12-10 16-28 8-42l-16-28a34 34 0 00-40-14l-46 17a168 168 0 00-59-34l-8-47c-3-16-17-25-33-25h-32c-16 0-30 9-33 25l-8 46a180 180 0 00-60 34l-46-17-11-2c-12 0-23 6-29 16l-16 28c-8 14-5 32 8 42l37 31a195 195 0 000 68l-37 31a34 34 0 00-8 42l16 28a34 34 0 0040 14l46-17c18 16 38 27 59 34l8 48a33 33 0 0033 27h32c16 0 30-12 33-28l8-48a170 170 0 0062-37l43 17 12 2c12 0 23-6 29-16l15-26c9-11 5-29-7-39m-210 47c-61 0-110-49-110-110s49-110 110-110 110 49 110 110-49 110-110 110"/></symbol>
<symbol viewBox="0 0 520 520"  id="u-close" xmlns="http://www.w3.org/2000/svg"><path d="M310 254l130-131c6-6 6-15 0-21l-20-21c-6-6-15-6-21 0L268 212a10 10 0 01-14 0L123 80c-6-6-15-6-21 0l-21 21c-6 6-6 15 0 21l131 131c4 4 4 10 0 14L80 399c-6 6-6 15 0 21l21 21c6 6 15 6 21 0l131-131a10 10 0 0114 0l131 131c6 6 15 6 21 0l21-21c6-6 6-15 0-21L310 268a10 10 0 010-14"/></symbol>
<symbol viewBox="0 0 520 520"  id="u-search" xmlns="http://www.w3.org/2000/svg"><path d="M496 453L362 320a189 189 0 10-340-92 190 190 0 00298 135l133 133a14 14 0 0021 0l21-21a17 17 0 001-22M210 338a129 129 0 11130-130 129 129 0 01-130 130"/></symbol>
<symbol viewBox="0 0 520 520"  id="u-chevronleft" xmlns="http://www.w3.org/2000/svg"><path d="M342 477L134 272c-6-6-6-16 0-22L342 45c6-6 16-6 22 0l22 22c6 6 6 16 0 22L221 250c-6 6-6 16 0 22l163 161c6 6 6 16 0 22l-22 22c-5 5-14 5-20 0"/></symbol>

<symbol viewBox="0 0 520 520"  id="u-lock" xmlns="http://www.w3.org/2000/svg"><path d="M110 190h40c6 0 10-3 10-9v-1A100 100 0 01267 80c53 4 93 50 93 104v-3c0 6 4 9 10 9h40c6 0 10-3 10-9v-1A160 160 0 00252 20c-85 4-150 76-152 161 1 5 5 9 10 9m-10-9v4zm360 89a40 40 0 00-40-40H100a40 40 0 00-40 40v190a40 40 0 0040 40h320a40 40 0 0040-40zM306 427c2 6-3 13-10 13h-73c-7 0-11-6-10-13l18-60a48 48 0 01-21-48 50 50 0 0139-38c32-6 60 17 60 47 0 16-8 31-21 39z"/></symbol>
<symbol viewBox="0 0 520 520"  id="u-success" xmlns="http://www.w3.org/2000/svg"><path d="M260 20a240 240 0 100 480 240 240 0 100-480m134 180L241 355c-6 6-16 6-22 0l-84-85c-6-6-6-16 0-22l22-22c6-6 16-6 22 0l44 45a10 10 0 0015 0l112-116c6-6 16-6 22 0l22 22c7 6 7 16 0 23"/></symbol>
</svg>
<div class="mock-bar"><strong>Mockup only</strong> — mobile allocation manager, three layouts side by side. Steppers are live and shared between the first two screens.</div>
<div class="stage">
  <div><div class="caption">1 · By site (default)</div><div class="phone" id="p1"></div></div>
  <div><div class="caption">2 · By product</div><div class="phone" id="p2"></div></div>
  <div><div class="caption">3 · Site Details (full-screen sheet)</div><div class="phone" id="p3"></div></div>
</div>
<script>
const PRODUCTS = [
    ['Amplify ELA G6 Student Consumable Set_NS','979-8-89512-646-2',39,'Amplify ELA'],
    ['Amplify ELA G7 Student Consumable Set','979-8-88699-582-4',37,'Amplify ELA'],
    ['Amplify ELA G8 Student Consumable Set','979-8-88699-583-1',41,'Amplify ELA'],
    ['Amplify ELA Student Text: A Raisin in the Sun','978-0-67975-533-3',60,'Amplify ELA'],
    ['Amplify ELA Trade Book G8: Narrative of the Life of Frederick Douglass','978-1-61700-762-0',60,'Amplify ELA'],
    ['Amplify ELA Uvl G6 Teacher Kit Box_NS','979-8-89512-648-6',15,'Amplify ELA'],
    ['Amplify ELA Uvl G7 Teacher Kit','978-1-63602-570-4',15,'Amplify ELA'],
    ['Amplify ELA Uvl G8 Teacher Kit','978-1-63602-571-1',15,'Amplify ELA'],
    ['Trade Book G6: Summer of the Mariposas','978-1-62014-010-9',60,'Amplify ELA'],
    ['Trade Book G8: Gris Grimly\'s Frankenstein','978-0-06186-298-4',60,'Amplify ELA'],
    ['mCLASS Intervention Kit Grades 4-6','978-1-95685-967-6',12,'Burst'],
    ['mCLASS Intervention Kit Grades K-3','978-1-95685-968-3',12,'Burst'],
    ['Amplify CKLA 3rd Ed G1 Knowledge Student Consumables Fairy Tales/Early Americas','979-8-89512-521-2',41,'CKLA'],
    ['Amplify CKLA 3rd Ed G1 Uvl Knowledge Classroom Kit Fairy Tales/Early Americas','979-8-89500-193-6',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G2 Knowledge Student Consumables Immigration/Nutrition','979-8-89512-544-1',37,'CKLA'],
    ['Amplify CKLA 3rd Ed G2 Uvl Knowledge Classroom Kit Immigration/Nutrition','979-8-89500-198-1',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G3 Student Consumable Set Charlotte\'s Web/Light and Sound','979-8-89500-319-0',40,'CKLA'],
    ['Amplify CKLA 3rd Ed G3 Uvl Complete Classroom Kit Charlotte\'s Web/Light & Sound','979-8-89500-161-5',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G4 Student Consumable Set Mixed-Up Files/Treasure Island','979-8-89500-322-0',40,'CKLA'],
    ['Amplify CKLA 3rd Ed G4 Uvl Integrated Classroom Kit Mixed-Up/Treasure Island','979-8-89500-164-6',20,'CKLA'],
    ['Amplify CKLA 3rd Ed G5 Student Consumable Set Tollbooth/Renaissance','979-8-89500-326-8',35,'CKLA'],
    ['Amplify CKLA 3rd Ed G5 Uvl Integrated Classroom Kit Tollbooth/Renaissance','979-8-89500-168-4',20,'CKLA'],
    ['Amplify CKLA 3rd Ed GK Knowledge Student Consumables Presidents/Seasons','979-8-89512-507-6',38,'CKLA'],
    ['Amplify CKLA 3rd Ed GK Uvl Knowledge Classroom Kit Presidents/Seasons','979-8-89500-190-5',20,'CKLA']
].map(([name,isbn,available,program],i)=>({id:'p'+i,name,isbn,available,program}));
let sites = [
    {id:'s1',name:'Lincoln Elementary',status:'In Progress',editable:true,configured:true},
    {id:'s2',name:'Roosevelt Middle School',status:'Confirmed',editable:true,configured:true},
    {id:'s3',name:'Site 3',status:'In Progress',editable:true,configured:false},
];
const q = {"p0-s1": 12, "p0-s2": 10, "p0-s3": 4, "p1-s1": 21, "p1-s2": 20, "p2-s1": 12, "p2-s2": 10, "p4-s1": 18, "p4-s2": 15, "p5-s1": 4, "p5-s2": 4, "p5-s3": 2, "p6-s1": 4, "p6-s2": 4, "p8-s1": 18, "p8-s2": 15, "p9-s1": 18, "p9-s2": 15, "p10-s1": 4, "p10-s2": 3, "p10-s3": 1, "p12-s1": 12, "p12-s2": 10, "p13-s1": 6, "p13-s2": 5, "p14-s1": 11, "p14-s2": 9, "p16-s1": 12, "p16-s2": 10, "p17-s1": 6, "p17-s2": 5, "p18-s1": 12, "p18-s2": 10, "p20-s1": 10, "p20-s2": 9, "p20-s3": 4, "p21-s1": 6, "p21-s2": 5, "p22-s1": 11, "p22-s2": 10};
const ORIGINAL_STATUS = Object.fromEntries(sites.map(s=>[s.id,s.status]));

const $=id=>document.getElementById(id);
const ico=(n,c='')=>`<svg class="slds-icon ${c}" aria-hidden="true"><use href="#u-${n}"></use></svg>`;
const dist=p=>sites.reduce((a,s)=>a+(q[p.id+'-'+s.id]||0),0), left=p=>p.available-dist(p), isOver=p=>left(p)<0;
const maxFor=(pid,sid)=>{const p=PRODUCTS.find(x=>x.id===pid);return Math.max(0,p.available-sites.filter(s=>s.id!==sid).reduce((a,s)=>a+(q[pid+'-'+s.id]||0),0));};
const st={menu:false,site:'s1',overOnly:false,open:new Set(),search:'',prog:''};
const unconfirmed=()=>sites.filter(s=>s.status!=='Confirmed').length;
const stepper=(p,s,err)=>`<div class="stepper"><button data-dec="${p.id}|${s.id}" aria-label="Decrease">−</button><input type="number" inputmode="numeric" class="${err?'err':''}" value="${q[p.id+'-'+s.id]||0}" data-in="${p.id}|${s.id}"><button data-inc="${p.id}|${s.id}" aria-label="Increase">+</button></div>`;
const overBanner=()=>{const n=PRODUCTS.filter(isOver).length;return n?`<div class="over">${ico('warning','slds-icon_x-small')}<span><b>${n} product${n>1?'s are':' is'} over-allocated.</b></span><button class="slds-button slds-button_neutral" data-overtoggle>${st.overOnly?'Show all':'Show'}</button></div>`:'';};
const footer=()=>{const u=unconfirmed();return `<div class="footer">${u?`<div class="hint">${u} allocations are not confirmed</div>`:''}<div class="row"><button class="slds-button slds-button_neutral">Save Draft</button><button class="slds-button slds-button_brand" ${u?'disabled':''}>Submit Order</button></div></div>`;};
const appbar=(sub)=>`<div class="appbar"><button class="slds-button slds-button_icon" aria-label="Back">${'<svg class="slds-button__icon" aria-hidden="true"><use href="#u-chevronleft"></use></svg>'}</button><div class="title">PQ 250113-412412<span class="sub">${sub}</span></div><span class="badge" style="background:#e3f0ff;color:var(--dxp-g-brand)">Open</span></div>`;
const seg=m=>`<div class="seg"><button class="${m==='site'?'on':''}">By site</button><button class="${m==='product'?'on':''}">By product</button></div>`;
const filtered=()=>PRODUCTS.filter(p=>(!st.overOnly||isOver(p))&&(!st.prog||p.program===st.prog)&&(!st.search||p.name.toLowerCase().includes(st.search)));

function r1(){const s=sites.find(x=>x.id===st.site),rows=filtered();
 const tot=PRODUCTS.reduce((a,p)=>a+(q[p.id+'-'+s.id]||0),0), n=PRODUCTS.filter(p=>(q[p.id+'-'+s.id]||0)>0).length;
 $('p1').innerHTML=appbar('Customer Quote Q-507564')+`<div class="scroll">${overBanner()}${seg('site')}
 <div class="sitepick"><button class="pickbtn" data-menu aria-haspopup="listbox" aria-expanded="${st.menu}"><span class="dot ${s.status==='Confirmed'?'ok':''}"></span><span class="nm">${s.name}</span><span class="of">${sites.indexOf(s)+1} of ${sites.length}</span><svg class="slds-icon slds-icon_x-small slds-icon-text-default" aria-hidden="true"><use href="#u-chevrondown"></use></svg></button>
 ${st.menu?`<div class="menu" role="listbox">${sites.length>8?'<div class="msearch"><input class="slds-input" placeholder="Find a site" data-msearch></div>':''}${sites.map(x=>{const u=PRODUCTS.reduce((a,p)=>a+(q[p.id+'-'+x.id]||0),0);return `<div class="mitem ${x.id===st.site?'on':''}" role="option" data-site="${x.id}"><span class="dot ${x.status==='Confirmed'?'ok':''}"></span><span class="nm">${x.name}<span class="sub">${x.status}${x.configured?'':' · missing address'}</span></span><span class="u">${u} units</span>${x.id===st.site?ico('check','slds-icon_x-small slds-icon-text-success'):''}</div>`;}).join('')}</div>`:''}</div>
 <div class="sitecard"><div style="display:flex;justify-content:space-between;align-items:center"><span class="name">${s.name}</span><span class="badge ${s.status==='Confirmed'?'b-conf':'b-prog'}">${s.status}</span></div>
  <div class="meta">${s.configured?'123 Main St, Springfield, IL · Sarah Johnson':ico('warning','slds-icon_xx-small slds-icon-text-warning')+' Missing shipping address'}</div>
  <button class="slds-button slds-button_neutral" data-sheet>${ico('settings','slds-button__icon')} Edit site details</button>
  <div class="totals"><span><b>${tot}</b> units</span><span><b>${n}</b> of ${PRODUCTS.length} products</span></div></div>
 <div class="tools"><div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left">${ico('search','slds-input__icon slds-input__icon_left slds-icon-text-default')}<input class="slds-input" data-search placeholder="Search products" value="${st.search}"></div>
  <div class="slds-select_container"><select class="slds-select" data-prog><option value="">All Programs</option>${[...new Set(PRODUCTS.map(p=>p.program))].map(x=>`<option ${st.prog===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 ${rows.map(p=>`<div class="prow"><div class="info"><div class="pname">${p.name}</div><div class="pmeta">${p.program} · ${p.isbn}</div><div class="left ${left(p)<0?'neg':''}">${left(p)<0?'Over by '+(-left(p)):left(p)+' left of '+p.available}</div></div>${stepper(p,s,isOver(p))}</div>`).join('')||'<p class="hintp">No products match.</p>'}
 </div>`+footer();}

function r2(){const rows=filtered();
 $('p2').innerHTML=appbar('Customer Quote Q-507564')+`<div class="scroll">${overBanner()}${seg('product')}
 ${rows.map(p=>{const d=dist(p),open=st.open.has(p.id),pct=Math.min(100,100*d/Math.max(1,p.available));return `<div class="pcard ${isOver(p)?'err':''}"><div class="phead" data-open="${p.id}"><div class="info"><div class="pname">${p.name}</div><div class="left ${isOver(p)?'neg':''}">${isOver(p)?'Over by '+(-left(p)):d+' of '+p.available+' assigned'}</div><div class="bar ${isOver(p)?'err':''}"><i style="width:${pct}%"></i></div></div><svg class="slds-icon slds-icon_x-small slds-icon-text-default" style="${open?'transform:rotate(180deg)':''}"><use href="#u-chevrondown"></use></svg></div>
  ${open?`<div class="pbody">${sites.map(s=>`<div class="srow"><span class="sn">${s.name}${s.status==='Confirmed'?' <span class="badge b-conf">Confirmed</span>':''}</span>${stepper(p,s,isOver(p))}</div>`).join('')}</div>`:''}</div>`;}).join('')}
 </div>`+footer();}

function r3(){const f=(l,v='',t='text')=>`<div class="slds-form-element"><label class="slds-form-element__label">${l}</label><div class="slds-form-element__control"><input class="slds-input" type="${t}" value="${v}"></div></div>`;
 const sel=(l,o)=>`<div class="slds-form-element"><label class="slds-form-element__label">${l}</label><div class="slds-form-element__control"><div class="slds-select_container"><select class="slds-select">${o.map(x=>`<option>${x}</option>`).join('')}</select></div></div></div>`;
 $('p3').innerHTML=`<div class="appbar"><button class="slds-button slds-button_icon" aria-label="Close"><svg class="slds-button__icon" aria-hidden="true"><use href="#u-close"></use></svg></button><div class="title">Site Details<span class="sub">Lincoln Elementary</span></div><span class="badge b-prog">In Progress</span></div>
 <div class="scroll form">${f('Display Name','Lincoln Elementary')}${sel('Shipping Address',['Lincoln Elementary — 123 Main St, Springfield, IL 62701'])}
 <div class="sec">Delivery contact</div>${sel('Ship To Contact',['Sarah Johnson'])}${f('Phone','217-555-0101','tel')}
 <div class="sec">Delay delivery</div><p class="hintp">Enter a date if delivery should not begin before a specific date.</p>${f('Do Not Deliver Before','','date')}
 <div class="sec">Dates you cannot accept delivery</div><p class="hintp">Up to 7 consecutive dates. US holidays are excluded automatically.</p>${f('Blackout Start Date','','date')}${f('Blackout End Date','','date')}
 <div class="sec">Proof of delivery</div>${f('Fiscal Year End Date','','date')}
 <div class="sec">Room of choice</div>${f('Room Name','')}${f('Floor Number','','number')}</div>
 <div class="footer"><div class="row"><button class="slds-button slds-button_neutral">Save</button><button class="slds-button slds-button_brand">Confirm</button></div></div>`;}

const all=()=>{r1();r2();r3();};
document.addEventListener('click',e=>{const t=e.target.closest('[data-inc],[data-dec],[data-site],[data-open],[data-overtoggle],[data-sheet],[data-menu]');
 if(!t){if(st.menu&&!e.target.closest('.menu')){st.menu=false;all();}return;}const d=t.dataset;
 if('menu' in d){st.menu=!st.menu;all();return;}
 if(d.site){st.site=d.site;st.menu=false;} else if(d.open){st.open.has(d.open)?st.open.delete(d.open):st.open.add(d.open);} else if('overtoggle' in d)st.overOnly=!st.overOnly;
 else if(d.inc||d.dec){const [pid,sid]=(d.inc||d.dec).split('|'),k=pid+'-'+sid,c=q[k]||0;if(d.inc){if(c<maxFor(pid,sid))q[k]=c+1;}else if(c>0)q[k]=c-1;}
 all();});
document.addEventListener('change',e=>{const i=e.target.closest('[data-in]');if(i){const [pid,sid]=i.dataset.in.split('|');q[pid+'-'+sid]=Math.max(0,parseFloat(i.value)||0);all();}
 if(e.target.matches('[data-prog]')){st.prog=e.target.value;all();}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){st.search=e.target.value.trim().toLowerCase();const pos=e.target.selectionStart;r1();r2();const n=document.querySelector('[data-search]');n.focus();n.setSelectionRange(pos,pos);}});
st.open.add(PRODUCTS.find(isOver).id);
all();
</script>
</body>
</html>
