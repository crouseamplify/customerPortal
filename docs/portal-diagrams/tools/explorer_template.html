<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amplify Customer Portal: Process Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --ink:#1b2733; --muted:#5b6b7a; --line:#d5dde5; --bg:#f4f6f9; --brand:#1565c0; --warn:#c62828; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
header { background:#10243a; color:#fff; padding:10px 18px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; font-weight:600; }
header .sub { color:#9fb3c8; font-size:12px; }
nav { display:flex; gap:2px; background:#fff; border-bottom:1px solid var(--line); padding:0 12px; flex-wrap:wrap; }
nav button { border:0; background:none; padding:11px 14px; cursor:pointer; font:inherit; color:var(--muted); border-bottom:3px solid transparent; }
nav button.on { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
nav button:focus-visible, .btn:focus-visible, li:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
main { flex:1; min-height:0; display:flex; }
section.tab { display:none; flex:1; min-width:0; }
section.tab.on { display:flex; }
.side { width:290px; background:#fff; border-right:1px solid var(--line); overflow:auto; padding:12px; flex:none; }
.detail { width:340px; background:#fff; border-left:1px solid var(--line); overflow:auto; padding:14px; flex:none; }
.stagewrap { flex:1; min-width:0; position:relative; overflow:hidden; background:#fff; cursor:grab; }
.stagewrap.drag { cursor:grabbing; }
.stage { position:absolute; left:0; top:0; transform-origin:0 0; }
.stage svg { display:block; }
.tools { position:absolute; right:12px; top:12px; display:flex; gap:6px; z-index:3; }
.btn { background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
.btn:hover { background:#eef3f8; }
.btn.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
h2 { font-size:15px; margin:0 0 4px; }
h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
.muted { color:var(--muted); }
.pill { display:inline-block; font-size:11px; border-radius:10px; padding:1px 8px; margin:0 4px 4px 0; background:#e8eef5; }
.pill.pub { background:#e0f2e1; } .pill.login { background:#ffe8cc; } .pill.warn { background:#fde0e0; color:var(--warn); }
ul.list { list-style:none; margin:0; padding:0; }
ul.list li { padding:6px 8px; border-radius:6px; cursor:pointer; }
ul.list li:hover { background:#eef3f8; } ul.list li.on { background:#dbe8f7; }
a.lnk { color:var(--brand); cursor:pointer; text-decoration:underline; }
svg g.node { cursor:pointer; }
svg g.node:hover polygon, svg g.node:hover path, svg g.node:hover ellipse { stroke-width:2.6; }
svg.dimmed g.node, svg.dimmed g.edge { opacity:.32; transition:opacity .2s; }
svg.dimmed g.node.hl, svg.dimmed g.edge.hl { opacity:1; }
svg g.node.sel path, svg g.node.sel polygon, svg g.node.sel ellipse { stroke:#d81b60 !important; stroke-width:3.2 !important; }
.steps li { display:flex; gap:8px; } .steps li b { flex:none; width:22px; height:22px; border-radius:11px; background:#e8eef5; text-align:center; font-size:12px; line-height:22px; }
.steps li.on b { background:var(--brand); color:#fff; }
.box { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; background:#fafcfe; }
table.mx { border-collapse:collapse; font-size:12px; }
table.mx th, table.mx td { border:1px solid #e3e9ef; padding:2px 5px; text-align:center; }
table.mx th.r { text-align:left; position:sticky; left:0; background:#fff; }
table.mx th.c { writing-mode:vertical-rl; transform:rotate(180deg); height:190px; font-weight:normal; white-space:nowrap; cursor:pointer; }
table.mx td.C { background:#c8e6c9; font-weight:bold; } table.mx td.U { background:#ffe0b2; font-weight:bold; } table.mx td.D { background:#ffcdd2; font-weight:bold; } table.mx td.R { background:#e0f2f1; }
table.mx tr.hover td, table.mx tr.hover th { background:#fff7c2 !important; }
.scroll { overflow:auto; flex:1; padding:12px; background:#fff; }
.find { border-left:4px solid #90a4ae; padding:6px 12px; margin:10px 0; background:#fff; }
.find.Fix { border-color:var(--warn); } .find.Review { border-color:#f9a825; }
label.chk { display:block; margin:4px 0; }
select, input[type=search] { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; width:100%; }
.legend span { display:inline-block; margin:2px 10px 2px 0; font-size:12px; }
.legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px; border:1.5px solid; }
@media (max-width:1000px){ .side{width:220px} .detail{width:260px} }
</style>
</head>
<body>
<header>
  <h1>Amplify Customer Portal: Process Explorer</h1>
  <span class="sub" id="meta"></span>
</header>
<nav id="tabs" role="tablist"></nav>
<main>
  <section class="tab" id="t-overview">
    <div class="stagewrap" id="ov-stage"></div>
    <div class="detail" id="ov-detail"></div>
  </section>
  <section class="tab" id="t-site">
    <div class="stagewrap" id="site-stage"></div>
    <div class="detail" id="site-detail"></div>
  </section>
  <section class="tab" id="t-journeys">
    <div class="side"><h2>Journeys</h2><ul class="list" id="j-list"></ul>
      <h3>Steps</h3><ol class="list steps" id="j-steps" style="padding-left:0"></ol></div>
    <div class="stagewrap" id="j-stage"></div>
    <div class="detail" id="j-detail"></div>
  </section>
  <section class="tab" id="t-flows">
    <div class="side"><input type="search" id="f-search" placeholder="Search flows" aria-label="Search flows"><div id="f-list"></div></div>
    <div class="stagewrap" id="f-stage"></div>
    <div class="detail" id="f-detail"></div>
  </section>
  <section class="tab" id="t-people">
    <div class="side">
      <h2>Simulate a user</h2>
      <p class="muted">Pick the contact types on the user's Contact record and their account tier.</p>
      <div id="p-types"></div>
      <h3>Account tier</h3>
      <select id="p-tier" aria-label="Account tier">
        <option value="3">3</option><option value="3T">3T</option><option value="3+">3+</option><option value="Other">Other / none</option><option value="GUEST">Not logged in (guest)</option>
      </select>
    </div>
    <div class="scroll" id="p-out"></div>
  </section>
  <section class="tab" id="t-data"><div class="scroll" id="d-out"></div></section>
  <section class="tab" id="t-callmap">
    <div class="stagewrap" id="cm-stage"></div>
    <div class="detail" id="cm-detail"></div>
  </section>
  <section class="tab" id="t-findings"><div class="scroll" id="fi-out"></div></section>
</main>
<script>
const DATA = /*__DATA__*/null;
const SVG = /*__SVG__*/null;
</script>
<script>
(function(){
'use strict';
const M = DATA.model, steps = DATA.steps;
const $ = (s, r) => (r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nid = (...p) => p.join('_').replace(/[^A-Za-z0-9_]/g,'_');
const routePage = r => { const p = Object.values(M.pages).find(x => x.route === r); return p ? pageTitle(p.id) : (r || ''); };
const label = a => (M.flows[a] ? M.flows[a].label : a);
const objLabel = o => M.objectLabels[o] || o;
const pageTitle = id => { const p = M.pages[id]; return p ? (p.title !== id ? p.title : id.replace(/_/g,' ')) : id; };

/* ---------- pan / zoom viewer ---------- */
function viewer(host, svgText, onNode) {
  host.innerHTML = '';
  const stage = document.createElement('div'); stage.className = 'stage'; stage.innerHTML = svgText;
  const svg = stage.querySelector('svg');
  const vb = svg.viewBox.baseVal; const W = vb.width, H = vb.height;
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.style.maxWidth = 'none';
  host.appendChild(stage);
  const tools = document.createElement('div'); tools.className = 'tools';
  tools.innerHTML = '<button class="btn" data-a="in" aria-label="Zoom in">+</button><button class="btn" data-a="out" aria-label="Zoom out">-</button><button class="btn" data-a="fit">Fit width</button><button class="btn" data-a="one">100%</button>';
  host.appendChild(tools);
  let k = 1, x = 10, y = 10;
  const apply = () => stage.style.transform = `translate(${x}px,${y}px) scale(${k})`;
  const fit = () => { k = Math.min(1.3, (host.clientWidth - 24) / W); x = 12; y = 12; apply(); };
  const zoomAt = (f, cx, cy) => { const nk = Math.max(.1, Math.min(4, k*f)); x = cx - (cx - x) * nk / k; y = cy - (cy - y) * nk / k; k = nk; apply(); };
  tools.addEventListener('click', e => { const a = e.target.dataset.a; if (!a) return;
    if (a==='in') zoomAt(1.25, host.clientWidth/2, host.clientHeight/2);
    if (a==='out') zoomAt(.8, host.clientWidth/2, host.clientHeight/2);
    if (a==='fit') fit(); if (a==='one') { k=1; x=12; y=12; apply(); } });
  host.addEventListener('wheel', e => { if (!(e.ctrlKey||e.metaKey||e.shiftKey)) { x -= e.deltaX; y -= e.deltaY; apply(); e.preventDefault(); return; }
    const r = host.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : .89, e.clientX - r.left, e.clientY - r.top); e.preventDefault(); }, {passive:false});
  let drag = null, moved = false;
  host.onpointerdown = e => { if (e.target.closest('.tools')) return; drag = {sx:e.clientX, sy:e.clientY, x, y}; moved = false; };
  window.addEventListener('pointermove', e => { if (!drag) return; const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy; if (Math.abs(dx)+Math.abs(dy) > 4) { moved = true; host.classList.add('drag'); }
    if (moved) { x = drag.x + dx; y = drag.y + dy; apply(); } });
  window.addEventListener('pointerup', () => { drag = null; host.classList.remove('drag'); });
  svg.querySelectorAll('g.node').forEach(g => { g.setAttribute('tabindex','0'); g.setAttribute('role','button');
    const open = () => { if (!moved && onNode) onNode(g.id, g); };
    g.addEventListener('click', open); g.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); onNode && onNode(g.id, g); } }); });
  if (host.clientWidth) fit(); else requestAnimationFrame(fit);
  const api = { svg, stage, fit, select(id) { svg.querySelectorAll('g.node.sel').forEach(n => n.classList.remove('sel')); const n = id && svg.querySelector('#'+CSS.escape(id)); if (n) n.classList.add('sel'); },
    focus(id) { const n = svg.querySelector('#'+CSS.escape(id)); if (!n) return; const nr = n.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      const cx = (nr.left + nr.width/2 - sr.left) / k, cy = (nr.top + nr.height/2 - sr.top) / k;
      k = Math.max(.85, Math.min(1.2, k)); x = host.clientWidth/2 - cx*k; y = host.clientHeight/2 - cy*k; apply(); },
    dim(ids) { svg.classList.add('dimmed'); svg.querySelectorAll('.hl').forEach(n => n.classList.remove('hl')); ids.forEach(id => { const n = svg.querySelector('#'+CSS.escape(id)); if (n) n.classList.add('hl'); });
      svg.querySelectorAll('g.edge').forEach(e => { const t = e.querySelector('title'); if (!t) return; const parts = t.textContent.split('->'); if (parts.length===2 && ids.includes(parts[0]) && ids.includes(parts[1])) e.classList.add('hl'); }); },
    undim() { svg.classList.remove('dimmed'); svg.querySelectorAll('.hl').forEach(n => n.classList.remove('hl')); } };
  return api;
}

/* ---------- helpers for detail panels ---------- */
const lnk = (txt, fn) => { const a = document.createElement('a'); a.className='lnk'; a.textContent = txt; a.tabIndex = 0; a.onclick = fn; a.onkeydown = e => { if (e.key==='Enter') fn(); }; return a; };
function html(h) { const d = document.createElement('div'); d.innerHTML = h; return d; }
function setPanel(el, nodes) { el.innerHTML = ''; nodes.forEach(n => el.appendChild(typeof n === 'string' ? html(n) : n)); }
function flowLinks(list) { const w = document.createElement('div'); list.forEach(a => { const d = document.createElement('div'); d.appendChild(lnk(label(a), () => openFlow(a))); w.appendChild(d); }); if (!list.length) w.innerHTML = '<span class="muted">none</span>'; return w; }

function pagePanel(id, host) {
  const p = M.pages[id]; if (!p) return;
  const out = [];
  out.push(`<h2>${esc(pageTitle(id))}</h2><div class="muted">${esc(p.path)}</div>`);
  out.push(`<div style="margin:8px 0"><span class="pill ${p.requiresLogin?'login':'pub'}">${p.requiresLogin?'Login required':'Open to guests'}</span><span class="pill">${esc(p.themeLayout)} layout</span></div>`);
  if (p.purpose) out.push(`<p>${esc(p.purpose)}</p>`);
  const tabs = p.tabs.length ? p.tabs : [{name:null, items:p.items}];
  tabs.forEach(t => {
    const fl = t.items.filter(i => i.kind==='flow' && i.flow);
    const lw = t.items.filter(i => i.kind==='lwc').map(i => i.lwc);
    if (!fl.length && !lw.length) return;
    out.push(`<h3>${t.name ? 'Tab: ' + esc(t.name) : 'On this page'}</h3>`);
    const d = document.createElement('div');
    fl.forEach(i => { const r = document.createElement('div'); r.appendChild(document.createTextNode('Flow: ')); if (M.flows[i.flow]) r.appendChild(lnk(label(i.flow), () => openFlow(i.flow))); else r.appendChild(html(`<span class="pill warn">${esc(i.flow)} (missing in org)</span>`));
      const args = Object.entries(i.args||{}); if (args.length) r.appendChild(html(`<div class="muted" style="font-size:12px">parameters: ${args.map(([k,v])=>esc(k)+' = '+esc(v)).join(', ')}</div>`)); d.appendChild(r); });
    lw.forEach(n => d.appendChild(html(`<div>LWC: <code>${esc(n)}</code></div>`)));
    out.push(d);
  });
  if (p.inMenus.length) out.push(`<h3>In ${p.inMenus.length} navigation menu variations</h3><div class="muted" style="font-size:12px">${p.inMenus.map(esc).join(', ')}</div>`);
  setPanel(host, out);
}

function flowPanel(a, host, nodeId) {
  const f = M.flows[a]; if (!f) return;
  const out = [];
  out.push(`<h2>${esc(f.label)}</h2><div class="muted">${esc(a)} · API ${esc(f.apiVersion)} · ${f.role==='page'?'screen flow on a page':f.role==='legacy'?'legacy flow':'subflow'}</div>`);
  if (f.purpose) out.push(`<p>${esc(f.purpose)}</p>`);
  if (f.placedOn.length) { out.push('<h3>Placed on</h3>'); const d = document.createElement('div'); f.placedOn.forEach(p => { const r = document.createElement('div'); r.appendChild(lnk(pageTitle(p.page), () => { show('site'); siteSelect(p.page); })); r.appendChild(document.createTextNode(p.location==='page'?'':' → '+p.location)); const args = Object.entries(p.args||{}); if (args.length) r.appendChild(html(`<span class="muted" style="font-size:12px"> (${args.map(([k,v])=>esc(k)+'='+esc(v)).join(', ')})</span>`)); d.appendChild(r); }); out.push(d); }
  if (f.launchedByLwc) out.push(`<h3>Launched by LWC</h3><code>${esc(f.launchedByLwc)}</code>`);
  out.push('<h3>Calls subflows</h3>'); out.push(flowLinks(f.calls));
  out.push('<h3>Called by</h3>'); out.push(flowLinks(f.calledBy.filter(x => x !== a).slice(0, 30)));
  const ob = f.objects;
  const rows = [['Reads', ob.read], ['Creates', ob.create], ['Updates', ob.update], ['Deletes', ob.delete]].filter(r => r[1].length);
  if (rows.length) { out.push('<h3>Data</h3>' + rows.map(r => `<div><b>${r[0]}:</b> ${r[1].map(o => esc(objLabel(o))).join(', ')}</div>`).join('')); }
  if (f.apex.length) out.push(`<h3>Apex / actions</h3><div>${f.apex.map(esc).join(', ')}</div>`);
  if (f.components.length) out.push(`<h3>Screen components</h3><div>${f.components.map(esc).join(', ')}</div>`);
  out.push(`<h3>Health</h3><div class="muted" style="font-size:12px">${f.tracked?'Usage-tracked (start/end actions). ':''}${f.faults.count} fault connectors, ${f.faults.to_fault_subflow} to the shared fault screen.</div>`);
  if (nodeId) {
    const n = Object.entries(f.graph.nodes).find(([k]) => nid(a, k) === nodeId);
    if (n) { const v = n[1]; let extra = '';
      if (v.type==='subflow') extra = `<div id="open-sub"></div>`;
      if (v.object) extra += `<div>Object: ${esc(objLabel(v.object))}${v.objectInferred?' (inferred from label)':''}</div>`;
      if (v.components && v.components.length) extra += `<div>Components: ${v.components.map(esc).join(', ')}</div>`;
      if (v.action) extra += `<div>Action: ${esc(v.action)}</div>`;
      out.unshift(`<div class="box"><div class="muted" style="font-size:11px;text-transform:uppercase">${esc(v.type)}</div><b>${esc(v.label)}</b>${extra}</div>`);
    }
  }
  setPanel(host, out);
  if (nodeId) { const f2 = Object.entries(f.graph.nodes).find(([k]) => nid(a, k) === nodeId); const holder = host.querySelector('#open-sub'); if (f2 && holder && f2[1].flow && M.flows[f2[1].flow]) holder.appendChild(lnk('Open subflow: ' + label(f2[1].flow), () => openFlow(f2[1].flow))); }
}

/* ---------- tabs ---------- */
const TABS = [['overview','Overview'],['site','Site map'],['journeys','Journeys'],['flows','Flows'],['people','Who sees what'],['data','Data'],['callmap','Flow dependencies'],['findings','Findings']];
const nav = $('#tabs'); const inited = {};
TABS.forEach(([id, name]) => { const b = document.createElement('button'); b.textContent = name; b.dataset.t = id; b.setAttribute('role','tab'); b.onclick = () => show(id); nav.appendChild(b); });
function show(id) { nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t===id)); document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id==='t-'+id));
  if (!inited[id]) { inited[id] = true; INIT[id](); } else if (V[id]) V[id].fit && requestAnimationFrame(() => V[id].fit()); location.hash = id; }
const V = {}; const INIT = {};
$('#meta').textContent = `${M.site.type} · generated ${M.site.generated} from ${M.site.sourceOrg} · ${Object.keys(M.pages).length} pages · ${Object.keys(M.flows).length} flows`;

/* ---------- overview ---------- */
INIT.overview = () => {
  V.overview = viewer($('#ov-stage'), SVG.architecture, id => {
    const m = id.match(/^a\d+_pg_(.+)$/); const f = id.match(/^a\d+_fl_(.+)$/);
    if (m) { pagePanel(m[1], $('#ov-detail')); V.overview.select(id); } else if (f) { flowPanel(f[1], $('#ov-detail')); V.overview.select(id); } });
  setPanel($('#ov-detail'), [`<h2>How it fits together</h2><p>Each band is one business area. Read left to right: who arrives, which page, which screen flows (and subflows) run, which data is written, and which record-triggered automation then fires.</p>
  <p class="muted">Click any page or flow for details. Drag to pan, scroll to move, Ctrl/Cmd or Shift + scroll to zoom.</p>
  <h3>Legend</h3><div class="legend"><span><i style="background:#e8f5e9;border-color:#2e7d32"></i>Page open to guests</span><span><i style="background:#fff3e0;border-color:#e65100"></i>Login required</span><span><i style="background:#d1c4e9;border-color:#4527a0"></i>Screen flow</span><span><i style="background:#ede7f6;border-color:#5e35b1"></i>Subflow</span><span><i style="background:#c8e6c9;border-color:#1b5e20"></i>Data written</span><span><i style="background:#fafafa;border-color:#9e9e9e"></i>Back-office automation</span></div>
  <h3>Cross-cutting</h3><p>Personalisation, usage tracking, the shared identity subflow and the shared fault screen apply everywhere. See <a class="lnk" id="ov-cc">cross-cutting mechanisms</a>.</p>`]);
  $('#ov-cc').onclick = () => { V.overview = viewer($('#ov-stage'), SVG.cross, null); };
};

/* ---------- site map ---------- */
let siteSelect = () => {};
INIT.site = () => {
  V.site = viewer($('#site-stage'), SVG.site, id => { if (id.startsWith('pg_')) { pagePanel(id.slice(3), $('#site-detail')); V.site.select(id); } });
  siteSelect = pid => { pagePanel(pid, $('#site-detail')); V.site.select('pg_'+pid); V.site.focus('pg_'+pid); };
  setPanel($('#site-detail'), [`<h2>Site map</h2><p>Green pages work without logging in. Orange pages require login. Orange arrows come from the top navigation, which is personalised per user (see <b>Who sees what</b>).</p><p class="muted">Click a page to see its tabs, flows and menu membership.</p>`]);
};

/* ---------- journeys ---------- */
let curJ = null, curStep = 0;
INIT.journeys = () => {
  const names = Object.keys(SVG.journeys);
  const titles = {'04-journey-sign-in':'1. Getting in','05-journey-guest-self-service':'2. Self-service without login','06-journey-onboarding':'3. Onboarding a new customer','07-journey-order-allocation':'4. Order allocation lifecycle','08-journey-professional-development':'5. Professional development'};
  const ul = $('#j-list');
  names.forEach(n => { const li = document.createElement('li'); li.tabIndex = 0; li.textContent = titles[n] || n; li.onclick = () => openJourney(n); li.onkeydown = e => { if (e.key==='Enter') openJourney(n); }; li.dataset.n = n; ul.appendChild(li); });
  openJourney(names[0]);
};
function openJourney(n) {
  curJ = n; curStep = 0;
  document.querySelectorAll('#j-list li').forEach(li => li.classList.toggle('on', li.dataset.n===n));
  V.journeys = viewer($('#j-stage'), SVG.journeys[n], id => { const i = steps[n].findIndex(s => s.node===id); if (i >= 0) goStep(i); });
  const ol = $('#j-steps'); ol.innerHTML = '';
  steps[n].forEach((s, i) => { const li = document.createElement('li'); li.tabIndex = 0; li.innerHTML = `<b>${i+1}</b><span>${esc(s.title)}</span>`; li.onclick = () => goStep(i); li.onkeydown = e => { if (e.key==='Enter') goStep(i); }; ol.appendChild(li); });
  goStep(0);
}
function goStep(i) {
  const s = steps[curJ]; curStep = Math.max(0, Math.min(s.length-1, i)); const st = s[curStep];
  document.querySelectorAll('#j-steps li').forEach((li, k) => li.classList.toggle('on', k===curStep));
  V.journeys.dim([st.node]); V.journeys.select(st.node);
  const det = $('#j-detail'); setPanel(det, [`<div class="muted">Step ${curStep+1} of ${s.length}</div><h2>${esc(st.title)}</h2><p>${esc(st.text)}</p>`]);
  const bar = document.createElement('div'); const prev = document.createElement('button'); prev.className='btn'; prev.textContent='Back'; prev.onclick=() => goStep(curStep-1);
  const next = document.createElement('button'); next.className='btn primary'; next.textContent='Next step'; next.style.marginLeft='6px'; next.onclick=() => goStep(curStep+1);
  const all = document.createElement('button'); all.className='btn'; all.textContent='Show all'; all.style.marginLeft='6px'; all.onclick=() => { V.journeys.undim(); V.journeys.select(null); };
  bar.append(prev, next, all); det.appendChild(bar);
  V.journeys.focus(st.node);
}

/* ---------- flows ---------- */
let curFlow = null;
function openFlow(a) { show('flows'); renderFlow(a); }
function renderFlow(a, nodeId) {
  if (!M.flows[a]) return; curFlow = a;
  document.querySelectorAll('#f-list li').forEach(li => li.classList.toggle('on', li.dataset.a===a));
  const key = a; if (!SVG.flows[key]) { $('#f-stage').innerHTML = '<p style="padding:20px">No diagram for this flow.</p>'; flowPanel(a, $('#f-detail')); return; }
  V.flows = viewer($('#f-stage'), SVG.flows[key], id => { V.flows.select(id); flowPanel(a, $('#f-detail'), id); });
  flowPanel(a, $('#f-detail'));
}
INIT.flows = () => {
  const host = $('#f-list'); const groups = [['page','Screen flows on pages'],['subflow','Subflows'],['legacy','Legacy']];
  const render = q => { host.innerHTML = '';
    groups.forEach(([r, t]) => { const list = Object.values(M.flows).filter(f => f.role===r && f.api !== 'Customer_Portal_Fault_Path_Screen' && (f.label+f.api).toLowerCase().includes(q)).sort((a,b)=>a.label.localeCompare(b.label)); if (!list.length) return;
      host.appendChild(html(`<h3>${t}</h3>`)); const ul = document.createElement('ul'); ul.className='list';
      list.forEach(f => { const li = document.createElement('li'); li.tabIndex = 0; li.dataset.a = f.api; li.textContent = f.label; li.onclick = () => renderFlow(f.api); li.onkeydown = e => { if (e.key==='Enter') renderFlow(f.api); }; if (f.api===curFlow) li.classList.add('on'); ul.appendChild(li); }); host.appendChild(ul); }); };
  $('#f-search').oninput = e => render(e.target.value.toLowerCase()); render('');
  if (!curFlow) renderFlow('CALM_Portal_Contacts_Display_Contacts');
};

/* ---------- people ---------- */
INIT.people = () => {
  const box = $('#p-types'); M.contactTypes.forEach(([code, name]) => { const l = document.createElement('label'); l.className='chk'; l.innerHTML = `<input type="checkbox" value="${code}"> ${esc(name)} <span class="muted">(${code})</span>`; box.appendChild(l); });
  const upd = () => { const types = [...box.querySelectorAll('input:checked')].map(i => i.value); const tier = $('#p-tier').value; const guest = tier==='GUEST'; box.querySelectorAll('input').forEach(i => i.disabled = guest);
    const order = M.contactTypes.map(c => c[0]);
    const row = M.personas.find(r => r.tier===tier && (guest ? true : r.types.join()===order.filter(c => types.includes(c)).join())); renderPersona(row, guest ? [] : types, tier); };
  box.onchange = upd; $('#p-tier').onchange = upd; upd();
};
function renderPersona(r, types, tier) {
  const out = $('#p-out'); out.innerHTML = '';
  const menuHtml = (slot, title) => { const v = r[slot]; if (!v) return `<div class="box"><b>${title}</b><div><span class="pill warn">no menu matches</span></div></div>`;
    const items = (M.menus[v.menu] || []).slice().sort((a,b)=>a.position-b.position).filter(i => i.type!=='MenuLabel' || true);
    return `<div class="box"><b>${title}</b><div class="muted" style="font-size:12px">variation "${esc(v.title)}" → menu ${esc(v.menu)}</div><ul style="margin:6px 0 0 18px;padding:0">${items.map(i => i.type==='MenuLabel' ? `<li><i>${esc(i.label)}</i></li>` : `<li>${esc(i.label)} <span class="muted">${esc(i.target||'')}</span>${i.page && !i.label.toLowerCase().includes(M.pages[i.page]?M.pages[i.page].title.toLowerCase().split(' ')[0]:'zzz') ? ' <span class="pill warn">links to '+esc(pageTitle(i.page))+'</span>' : ''}</li>`).join('')}</ul></div>`; };
  const who = tier==='GUEST' ? 'A visitor who is not logged in' : (types.length ? types.join(' + ') : 'A logged-in contact with no contact type') + ' on tier ' + tier;
  out.appendChild(html(`<h2>${esc(who)}</h2>`));
  out.appendChild(html(menuHtml('innerBar','Desktop menu on inner pages') + menuHtml('innerHamburger','Mobile menu on inner pages') + menuHtml('homeBar','Desktop menu on the home page') + menuHtml('homeHamburger','Mobile menu on the home page')));
  const warn = [r.innerBar, r.innerHamburger, r.homeBar, r.homeHamburger].map(v => v && v.menu); if (new Set(warn).size > 1) out.appendChild(html(`<div class="find Fix"><b>Menus differ between desktop and mobile or between home and inner pages for this user.</b> See Findings.</div>`));
  out.appendChild(html(`<div class="box"><b>Home page tiles</b><ul style="margin:6px 0 0 18px;padding:0">${r.homeTiles.map(t => `<li>${esc(t.label)} <span class="muted">→ ${esc(routePage(t.route))}</span></li>`).join('')}</ul></div>`));
  const pg = new Set(((M.menus[r.innerBar && r.innerBar.menu])||[]).map(i => i.page).filter(Boolean));
  const d = document.createElement('div'); d.className='box'; d.innerHTML = '<b>Pages reachable from this user\'s desktop menu</b><div id="reach" style="margin-top:6px"></div>'; out.appendChild(d);
  [...pg].forEach(p => { const s = document.createElement('div'); s.appendChild(lnk(pageTitle(p), () => { show('site'); siteSelect(p); })); d.querySelector('#reach').appendChild(s); });
}

/* ---------- data matrix ---------- */
INIT.data = () => {
  const flows = Object.values(M.flows).filter(f => f.api !== 'Customer_Portal_Fault_Path_Screen').sort((a,b) => (a.role==='page'?0:1)-(b.role==='page'?0:1) || a.label.localeCompare(b.label));
  const objs = [...new Set(flows.flatMap(f => ['read','create','update','delete'].flatMap(k => f.objects[k])))].sort((a,b) => (a.endsWith('__mdt')-b.endsWith('__mdt')) || (a.endsWith('__e')-b.endsWith('__e')) || objLabel(a).localeCompare(objLabel(b)));
  const t = document.createElement('table'); t.className = 'mx';
  let h = '<thead><tr><th class="r">Object \\ Flow</th>' + flows.map(f => `<th class="c" data-a="${f.api}" title="${esc(f.api)}">${esc(f.label.replace('CALM Portal | ','').replace('Customer Portal | ','').slice(0,34))}</th>`).join('') + '</tr></thead><tbody>';
  objs.forEach(o => { h += `<tr><th class="r">${esc(objLabel(o))}</th>` + flows.map(f => { const ops = [['create','C'],['update','U'],['delete','D'],['read','R']].filter(([k]) => f.objects[k].includes(o)); return ops.length ? `<td class="${ops[0][1]}" title="${esc(ops.map(x=>x[0]).join(', '))}: ${esc(f.label)}">${ops[0][1]}</td>` : '<td></td>'; }).join('') + '</tr>'; });
  t.innerHTML = h + '</tbody>';
  t.onclick = e => { const th = e.target.closest('th.c'); if (th) openFlow(th.dataset.a); };
  t.onmouseover = e => { t.querySelectorAll('tr.hover').forEach(r => r.classList.remove('hover')); const tr = e.target.closest('tr'); if (tr) tr.classList.add('hover'); };
  const o = $('#d-out'); o.appendChild(html('<h2>Data map</h2><p class="muted">C create · U update · D delete · R read (strongest operation shown; hover a cell for all). Click a column header to open that flow. Bold-purple columns first: flows placed on pages; then shared subflows.</p>')); o.appendChild(t);
};

/* ---------- call map ---------- */
INIT.callmap = () => { V.callmap = viewer($('#cm-stage'), SVG.callmap, id => { V.callmap.select(id); if (id.startsWith('fl_')) flowPanel(id.slice(3), $('#cm-detail')); else if (id.startsWith('pg_')) pagePanel(id.slice(3), $('#cm-detail')); });
  setPanel($('#cm-detail'), ['<h2>Flow dependencies</h2><p>Pages on the left embed screen flows; arrows show which flows call which subflows. Click a node for its purpose, data and callers.</p>']); };

/* ---------- findings ---------- */
INIT.findings = () => { const o = $('#fi-out'); o.appendChild(html('<h2>Findings from the review</h2><p class="muted">Observations made while extracting the model. Fix = looks like a defect. Review = worth a look. Info = context.</p>'));
  DATA.findings.forEach(f => o.appendChild(html(`<div class="find ${esc(f.severity)}"><b>${esc(f.severity)}: ${esc(f.title)}</b><div>${esc(f.detail)}</div><div class="muted" style="font-size:12px">Evidence: ${esc(f.evidence)}</div></div>`))); };

show((location.hash || '#overview').slice(1) in INIT ? (location.hash || '#overview').slice(1) : 'overview');
})();
</script>
</body>
</html>
