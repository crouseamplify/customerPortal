<template>

    <!-- ============================================================
         LIST VIEW — BSO selector grouped by program
         ============================================================ -->
    <template lwc:if={isListView}>
        <div class="oam-container">
            <div class="oam-page-header">
                <h1 class="slds-text-heading_large">Manage Orders</h1>
                <p class="slds-text-body_regular slds-m-top_x-small">
                    Select an Amplify Price Quote to view and manage your allocation quantities.
                </p>
            </div>

            <div class="bso-list slds-m-top_medium">
                <template for:each={bsoGroupsView} for:item="group">
                    <div key={group.program} class="program-group slds-m-bottom_small">

                        <div class="program-group-header"
                             data-program={group.program}
                             onclick={handleToggleGroup}>
                            <lightning-icon
                                icon-name={group.chevronIcon}
                                size="x-small"
                                class="slds-m-right_x-small chevron-icon">
                            </lightning-icon>
                            <span class="program-name">{group.program}</span>
                            <span class="order-count">{group.orderCount} order(s)</span>
                        </div>

                        <template lwc:if={group.expanded}>
                            <div class="program-orders">
                                <template for:each={group.orders} for:item="order">
                                    <div key={order.id} class="bso-row">
                                        <div class="bso-info">
                                            <div class="bso-pq-number">{order.pqNumber}</div>
                                            <div class="bso-meta">
                                                <span class="meta-label">Customer Quote:</span> {order.customerQuote}
                                                &nbsp;&bull;&nbsp;
                                                <span class="meta-label">PO:</span> {order.poNumber}
                                                &nbsp;&bull;&nbsp;
                                                <span class="meta-label">End Date:</span> {order.orderEndDate}
                                            </div>
                                        </div>
                                        <div class="bso-status-area">
                                            <span class={order.statusBadgeClass}>{order.allocationStatus}</span>
                                        </div>
                                        <div class="bso-actions">
                                            <lightning-button
                                                label="Manage Order"
                                                variant="brand"
                                                data-id={order.id}
                                                onclick={handleSelectBso}>
                                            </lightning-button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                    </div>
                </template>
            </div>
        </div>
    </template>


    <!-- ============================================================
         TABLE VIEW — Allocation manager
         ============================================================ -->
    <template lwc:if={isTableView}>
        <div class="oam-container">

            <!-- Breadcrumb + BSO Summary -->
            <div class="oam-page-header">
                <div class="breadcrumb">
                    <a class="breadcrumb-link" onclick={handleBack}>All Orders</a>
                    <span class="breadcrumb-sep">/</span>
                    <span class="breadcrumb-current">{selectedBso.pqNumber}</span>
                </div>
                <div class="bso-summary-bar slds-m-top_small">
                    <div class="summary-field">
                        <span class="summary-label">Customer Quote</span>
                        <span class="summary-value">{selectedBso.customerQuote}</span>
                    </div>
                    <div class="summary-field">
                        <span class="summary-label">Program</span>
                        <span class="summary-value">{selectedBso.program}</span>
                    </div>
                    <div class="summary-field">
                        <span class="summary-label">PO Number</span>
                        <span class="summary-value">{selectedBso.poNumber}</span>
                    </div>
                    <div class="summary-field">
                        <span class="summary-label">Order End Date</span>
                        <span class="summary-value">{selectedBso.orderEndDate}</span>
                    </div>
                    <div class="summary-field">
                        <span class="summary-label">Status</span>
                        <span class={selectedBso.statusBadgeClass}>{selectedBso.allocationStatus}</span>
                    </div>
                </div>
            </div>

            <!-- Main body: table + drawer -->
            <div class={managerBodyClass}>

                <!-- Table Section -->
                <div class="table-section">

                    <!-- Toolbar -->
                    <div class="toolbar slds-m-bottom_small">
                        <div class="toolbar-left">
                            <div class="search-wrapper">
                                <lightning-input
                                    type="search"
                                    label="Search Products"
                                    variant="label-hidden"
                                    placeholder="Search by name or ISBN..."
                                    value={searchTerm}
                                    onchange={handleSearch}>
                                </lightning-input>
                            </div>
                            <div class="filter-wrapper">
                                <lightning-combobox
                                    label="Program"
                                    variant="label-hidden"
                                    placeholder="All Programs"
                                    options={programFilterOptions}
                                    value={programFilter}
                                    onchange={handleProgramFilter}>
                                </lightning-combobox>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <lightning-button
                                label="+ Add Site"
                                variant="neutral"
                                onclick={handleAddSite}>
                            </lightning-button>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="table-scroll-container">
                        <table class="allocation-table">
                            <thead>
                                <!-- Row 1: fixed col headers (rowspan) + site name headers -->
                                <tr class="site-header-row">
                                    <th class="col-product th-freeze-1" rowspan="2">Product</th>
                                    <th class="col-number th-freeze-2" rowspan="2">Available</th>
                                    <th class="col-number th-freeze-3" rowspan="2">Distributed</th>
                                    <th class="col-number th-freeze-4 col-remaining-header" rowspan="2">Remaining</th>
                                    <template for:each={sitesForHeader} for:item="site">
                                        <th key={site.id} class={site.thClass}>
                                            <div class="site-header-content">
                                                <div class="site-name-row">
                                                    <button
                                                        class="site-name-btn"
                                                        data-id={site.id}
                                                        onclick={handleSiteClick}
                                                        title="Configure site details">
                                                        {site.displayName}
                                                    </button>
                                                    <template lwc:if={site.configured}>
                                                        <lightning-icon
                                                            icon-name="utility:check"
                                                            size="xx-small"
                                                            class="icon-configured"
                                                            title="Site configured">
                                                        </lightning-icon>
                                                    </template>
                                                    <template lwc:if={site.notConfigured}>
                                                        <lightning-icon
                                                            icon-name="utility:warning"
                                                            size="xx-small"
                                                            class="icon-warning"
                                                            title="Missing shipping address">
                                                        </lightning-icon>
                                                    </template>
                                                </div>
                                                <div class="site-controls">
                                                    <span class={site.statusBadgeClass}>{site.status}</span>
                                                    <lightning-button-icon
                                                        icon-name="utility:settings"
                                                        variant="bare"
                                                        size="small"
                                                        title="Configure site details"
                                                        data-id={site.id}
                                                        onclick={handleSiteClick}>
                                                    </lightning-button-icon>
                                                    <template lwc:if={site.editable}>
                                                        <lightning-button-icon
                                                            icon-name="utility:refresh"
                                                            variant="bare"
                                                            size="small"
                                                            title="Clear all quantities for this site"
                                                            data-id={site.id}
                                                            onclick={handleClearSite}>
                                                        </lightning-button-icon>
                                                        <lightning-button-icon
                                                            icon-name="utility:delete"
                                                            variant="bare"
                                                            size="small"
                                                            title="Remove this site"
                                                            data-id={site.id}
                                                            onclick={handleRemoveSite}>
                                                        </lightning-button-icon>
                                                    </template>
                                                </div>
                                            </div>
                                        </th>
                                    </template>
                                </tr>
                                <!-- Row 2: "Assigned" label for each site column -->
                                <tr class="col-label-row">
                                    <template for:each={sitesForHeader} for:item="site">
                                        <th key={site.id} class="col-assigned-label">Assigned</th>
                                    </template>
                                </tr>
                            </thead>

                            <tbody>
                                <template for:each={pagedProducts} for:item="product">
                                    <tr key={product.id} class="product-row">
                                        <td class="col-product td-freeze-1">
                                            <div class="product-name">{product.name}</div>
                                            <div class="product-meta-row">
                                                <span class="product-program-label">{product.program}</span>
                                                <template lwc:if={product.isbn}>
                                                    <span class="product-isbn-inline">{product.isbn}</span>
                                                </template>
                                            </div>
                                        </td>
                                        <td class="col-number td-freeze-2">{product.available}</td>
                                        <td class="col-number td-freeze-3">{product.distributed}</td>
                                        <td class={product.remainingClass}>
                                            <template lwc:if={product.overAllocated}>
                                                <lightning-icon
                                                    icon-name="utility:warning"
                                                    size="xx-small"
                                                    class="icon-over-allocated"
                                                    title={product.overAllocatedMessage}>
                                                </lightning-icon>
                                            </template>
                                            {product.remaining}
                                        </td>
                                        <template for:each={product.siteData} for:item="siteCell">
                                            <td key={siteCell.id} class="col-input">
                                                <template lwc:if={siteCell.editable}>
                                                    <div class="input-cell">
                                                        <button
                                                            class="qty-btn minus"
                                                            data-product-id={product.id}
                                                            data-site-id={siteCell.id}
                                                            onclick={handleDecrement}>−</button>
                                                        <input
                                                            type="number"
                                                            class={siteCell.inputClass}
                                                            min="0"
                                                            data-product-id={product.id}
                                                            data-site-id={siteCell.id}
                                                            onfocus={handleInputFocus}
                                                            oninput={handleInput}
                                                            onblur={handleInputBlur}>
                                                        <button
                                                            class="qty-btn plus"
                                                            data-product-id={product.id}
                                                            data-site-id={siteCell.id}
                                                            onclick={handleIncrement}>+</button>
                                                    </div>
                                                </template>
                                                <template lwc:if={siteCell.notEditable}>
                                                    <div class="input-cell">
                                                        <input
                                                            type="number"
                                                            class="qty-input qty-disabled"
                                                            disabled
                                                            data-product-id={product.id}
                                                            data-site-id={siteCell.id}>
                                                    </div>
                                                </template>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Table footer -->
                    <div class="table-footer">
                        <span class="product-count">
                            {pageStart}–{pageEnd} of {filteredProductCount} products
                            <template lwc:if={programFilter}>
                                &nbsp;(filtered from {totalProductCount})
                            </template>
                        </span>
                        <div class="page-size-picker">
                            <label class="page-size-label" for="pageSizeSelect">Per page:</label>
                            <select
                                id="pageSizeSelect"
                                class="page-size-select"
                                onchange={handlePageSizeChange}>
                                <option value="1"   selected={isPageSize1}>1</option>
                                <option value="5"   selected={isPageSize5}>5</option>
                                <option value="10"  selected={isPageSize10}>10</option>
                                <option value="25"  selected={isPageSize25}>25</option>
                                <option value="50"  selected={isPageSize50}>50</option>
                                <option value="75"  selected={isPageSize75}>75</option>
                                <option value="100" selected={isPageSize100}>100</option>
                            </select>
                        </div>
                        <div class="pagination-controls">
                            <lightning-button-icon
                                icon-name="utility:chevronleft"
                                variant="bare"
                                size="small"
                                title="Previous page"
                                disabled={isFirstPage}
                                onclick={handlePrevPage}>
                            </lightning-button-icon>
                            <span class="page-label">{pageLabel}</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                size="small"
                                title="Next page"
                                disabled={isLastPage}
                                onclick={handleNextPage}>
                            </lightning-button-icon>
                        </div>
                        <div class="footer-actions">
                            <lightning-button
                                label="Save Draft"
                                variant="neutral"
                                onclick={handleSaveDraft}>
                            </lightning-button>
                            <lightning-button
                                label="Submit Order"
                                variant="brand"
                                onclick={handleSubmitClick}>
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <!-- Right Drawer -->
                <div class={drawerClass}>
                    <div class="drawer-header">
                        <span class="drawer-title">Site Details</span>
                        <button class="drawer-close-btn" onclick={handleCloseDrawer} title="Close">
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                    </div>
                    <template lwc:if={activeSite}>
                        <div class="drawer-body">

                            <!-- Site Details -->
                            <div class="drawer-section">
                                <div class="drawer-field">
                                    <lightning-input
                                        label="Display Name"
                                        value={activeSite.displayName}
                                        placeholder="e.g., Lincoln Elementary"
                                        onchange={handleDisplayNameChange}>
                                    </lightning-input>
                                </div>
                                <div class="drawer-field">
                                    <lightning-combobox
                                        label="Shipping Address"
                                        placeholder="Select a shipping address..."
                                        options={shippingAddressOptions}
                                        value={activeSite.addressId}
                                        onchange={handleAddressChange}>
                                    </lightning-combobox>
                                </div>
                                <template lwc:if={activeSite.addressId}>
                                    <div class="address-preview">
                                        <lightning-icon
                                            icon-name="utility:location"
                                            size="x-small"
                                            class="slds-m-right_x-small">
                                        </lightning-icon>
                                        {activeSite.addressLabel}
                                    </div>
                                </template>
                            </div>

                            <!-- Delivery Contact -->
                            <div class="drawer-section">
                                <h4 class="drawer-section-title">Delivery Contact</h4>
                                <div class="drawer-field">
                                    <lightning-combobox
                                        label="Ship To Contact"
                                        placeholder="Select a contact..."
                                        options={shippingContactOptions}
                                        value={activeSite.contactId}
                                        onchange={handleContactChange}>
                                    </lightning-combobox>
                                </div>
                                <div class="drawer-field">
                                    <lightning-input
                                        type="tel"
                                        label="Phone"
                                        value={activeSite.contactPhone}
                                        placeholder="e.g., 217-555-0101"
                                        onchange={handlePhoneChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Delay Delivery -->
                            <div class="drawer-section">
                                <h4 class="drawer-section-title">Delay Delivery</h4>
                                <p class="drawer-section-hint">Enter a date if delivery should not begin before a specific date.</p>
                                <div class="drawer-field">
                                    <lightning-input
                                        type="date"
                                        label="Do Not Deliver Before"
                                        value={activeSite.doNotDeliverBefore}
                                        onchange={handleDoNotDeliverBeforeChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Blackout Dates -->
                            <div class="drawer-section">
                                <h4 class="drawer-section-title">Dates You Cannot Accept Delivery</h4>
                                <p class="drawer-section-hint">Enter up to 7 consecutive unavailable dates. US holidays are automatically excluded.</p>
                                <div class="drawer-field">
                                    <lightning-input
                                        type="date"
                                        label="Blackout Start Date"
                                        value={activeSite.blackoutStart}
                                        onchange={handleBlackoutStartChange}>
                                    </lightning-input>
                                </div>
                                <div class="drawer-field">
                                    <lightning-input
                                        type="date"
                                        label="Blackout End Date"
                                        value={activeSite.blackoutEnd}
                                        onchange={handleBlackoutEndChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Proof of Delivery -->
                            <div class="drawer-section">
                                <h4 class="drawer-section-title">Proof of Delivery</h4>
                                <p class="drawer-section-hint">If this delivery must be confirmed within your fiscal year, provide the fiscal year end date.</p>
                                <div class="drawer-field">
                                    <lightning-input
                                        type="date"
                                        label="Fiscal Year End Date"
                                        value={activeSite.fiscalYearEnd}
                                        onchange={handleFiscalYearEndChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Room of Choice -->
                            <div class="drawer-section">
                                <h4 class="drawer-section-title">Room of Choice</h4>
                                <p class="drawer-section-hint">If your delivery service includes room-of-choice delivery, specify the destination room.</p>
                                <div class="drawer-field">
                                    <lightning-input
                                        label="Room Name"
                                        value={activeSite.roomOfChoice}
                                        placeholder="e.g., Library, Room 204"
                                        maxlength="50"
                                        onchange={handleRoomOfChoiceChange}>
                                    </lightning-input>
                                </div>
                                <div class="drawer-field">
                                    <lightning-input
                                        type="number"
                                        label="Floor Number"
                                        value={activeSite.floorNumber}
                                        min="1"
                                        max="9999"
                                        step="1"
                                        onchange={handleFloorNumberChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="drawer-actions">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleSaveDrawer}>
                                </lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleCloseDrawer}>
                                </lightning-button>
                            </div>

                        </div>
                    </template>
                </div>

            </div><!-- /manager-body -->
        </div>
    </template>


    <!-- ============================================================
         SUBMIT CONFIRMATION MODAL
         ============================================================ -->
    <template lwc:if={showSubmitModal}>
        <div class="modal-backdrop" onclick={handleBackdropClick}>
            <div class="modal-container">
                <div class="modal-header">
                    <h2 class="slds-text-heading_medium">Submit Allocation Request</h2>
                    <button class="modal-close-btn" onclick={handleCloseSubmitModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="slds-text-body_regular slds-m-bottom_medium">
                        Review the items below before submitting. Once submitted, your order
                        will be sent for processing and quantities will be locked.
                    </p>
                    <ul class="preflight-list">
                        <template for:each={submitChecks} for:item="check">
                            <li key={check.id} class={check.itemClass}>
                                <lightning-icon
                                    icon-name={check.icon}
                                    size="x-small"
                                    class="slds-m-right_x-small preflight-icon">
                                </lightning-icon>
                                <span>{check.label}</span>
                            </li>
                        </template>
                    </ul>
                </div>
                <div class="modal-footer">
                    <lightning-button
                        label="Go Back"
                        variant="neutral"
                        onclick={handleCloseSubmitModal}>
                    </lightning-button>
                    <lightning-button
                        label="Submit Order"
                        variant="brand"
                        disabled={hasSubmitErrors}
                        onclick={handleConfirmSubmit}>
                    </lightning-button>
                </div>
            </div>
        </div>
    </template>

</template>
