<template>
    <div>
        <div class="content slds-var-m-around_x-small">
            <div class="slds-grid slds-gutters">
                <div class="slds-col ">
                    <span>
                       <template lwc:if={listdata.DisplayTracking}>          
                             <p>Shipped Date: {listdata.ShipDate} </p>
                             <p>Carrier: {listdata.Carrier} </p>
                        </template>
                        <template lwc:else>    
                 <!-- Space for FSOI Header information <p>Shipment Number: {listdata.InternalId}</p>  -->                      
                       </template>            
                    </span>
                </div>

                    <div class="slds-col ">
                        <p>Shipment Status:  </p>
                        <!--Pass a css class to make dynamic - not currently implemented (shipped is message green )-->
                        <lightning-badge label={listdata.Status} class="shipped"></lightning-badge>
                        <br/><br/>
                    </div>

                     <div class="slds-col"><span> <template if:true={listdata.DisplayTracking}>
                                    
                                    <lightning-button 
                                    variant="brand"
                                    label="Track Shipment"
                                    icon-name="utility:new_window"
                                    icon-position="left"
                                    onclick={handleTrackingClick}
                                    >
                                    </lightning-button>
                                </template></span>
                        </div>
                

            </div>

            <br />
            <!--Headers for line item details-->
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_2-of-8">
                    <span><b>Product ISBN</b></span>
                </div>
                <div class="slds-col slds-size_4-of-8">
                    <span><b>Product name</b></span>
                </div>
                <div class="slds-col slds-size_2-of-8">
                    <template if:false={listdata.DisplayTracking}>
                    <b>Quantity</b></template>
                    <template if:true={listdata.DisplayTracking}>
                    <b>Quantity</b>
                </template>
                </div>
 <!--               <div class="slds-col slds-size_1-of-8">
                    
                    <span><b>Shipped</b></span>
                </div>-->
            </div>

            <!--Display rows of the line item details-->
            <template for:each={orderDetail} for:item="orderitem">
                <c-order-status-results-tile-item listdetailitem={orderitem} class="slds-var-p-around_xxx-small"
                    key={orderitem.Id}>
                </c-order-status-results-tile-item>
            </template>

        </div>
    </div>
</template>
