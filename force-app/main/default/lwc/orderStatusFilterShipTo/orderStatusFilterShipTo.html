<template>
    <br/>
    Quote number:  <div class = "medium2" >{filters.PQ}</div><br/>

    <!-- ****Amplify decided not to display the UltimateParent or Parent account *******
        <template if:true={singleorderShipto.UltimateParent}><p class="medium"><b> {singleorderShipto.UltimateParent}</b></p></template>
    <template if:true={singleorderShipto.Parent}><p>{singleorderShipto.Parent}</p></template>-->
    Account: <div class ="medium2">{singleorderShipto.DistrictName}</div>
    <template if:true={singleorderShipto.CustomerPO}>
        <br />
        Customer PO: <div class="medium2"> {singleorderShipto.CustomerPO} </div>
    </template>

    <br /><br />
 <!--  <span class="slds-icon_container slds-icon-custom-custom106" title="Dekivery Location">
        <svg class="slds-icon" aria-hidden="true">
        <use xlink:href="/assets/icons/custom-sprite/svg/symbols.svg#custom106"></use>
        </svg>
        <span class="slds-assistive-text">Delivery Location</span>
        </span>-->

    <lightning-combobox class="medium" name="ShipToList" label="Delivery location" value={value} placeholder={value} options={ShipToOptions}
        onchange={handleshipToNameChange}>
    </lightning-combobox>

    <lightning-card class="medium">
 <!--      <p slot="title" class="medium">Delivery Location</p> 
        <lightning-combobox name="ShipToList" label="Delivery Location" value={value} placeholder={value} options={ShipToOptions}
            onchange={handleshipToNameChange}>
        </lightning-combobox>-->
        <br />
        <p class="medium2">Shipping details: </p>

        <template lwc:if={singleorderShipto.Name}>
            <div class="shadedbox">
                <span>Account: <b>{singleorderShipto.Name} </b> </span><br />
                <span>Contact: <b>{singleorderShipto.ShipToContact} </b></span><br />
                <span><b>{singleorderShipto.ShipToStreet} </b></span><br />
                <span><b>{singleorderShipto.ShipToCity}, {singleorderShipto.ShipToState} {singleorderShipto.ShipToZip} </b>
                </span><br />
                <span><b>{singleorderShipto.ShipToCountry}</b></span><br />
            </div>
        </template>
        <template lwc:else>
            <div class="shadedbox"><p>No data is available.</p></div>    
        </template>

    </lightning-card>
    <br />
    <br />
    <p class = "medium"><em>You have 60 (sixty) days to inventory the delivered materials. If there are missing or damaged materials,
            please provide the following information to <a href="https://service.amplify.com/support" onclick={handleCustomerCareClick}>the customer care team</a>:</em></p>
    <br />
        <lightning-formatted-rich-text class= "small" value="
        &lt;ul>
        &lt;li>&lt;p>Quote number for your order.&lt;/p>&lt;/li>
        &lt;li>&lt;p>The product name(s) and quantities of the missing, damaged, or misprinted materials.&lt;/p>&lt;/li>
        &lt;li>&lt;p>Your school contact name and email address.&lt;/p>&lt;/li>
        &lt;/ul>" ></lightning-formatted-rich-text>
</template>
