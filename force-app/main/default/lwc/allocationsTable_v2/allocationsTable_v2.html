<template>
	<lightning-card>
        <!--<div class="head-banner"><lightning-card  title="Allocation Table"></lightning-card></div>-->
        <!--<div class="boxes">
            <lightning-input name="Blanket Sales Order" label="Blanket Sales Order" value={blanketSalesOrder.Name} style="margin-right: 10px;" disabled></lightning-input>
            <lightning-combobox name="Parent Account" label="Parent Account" options={accountOptions} value={accountFilterValue} placeholder="--None--" dropdown-alignment="auto" disabled></lightning-combobox>
            <lightning-input type="text" label="Parent Account" value={accountTextValue} disabled></lightning-input>
        </div>-->
        <div class="boxes">
            <div style="display: flex;flex-direction: row;">
                <div class="search-container">
                    <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                        <lightning-input
                            type="search"
                            label="Product Search"
                            placeholder="Enter search term..."
                            onchange={handleSearch}
                            onfocusout={handleUnfocus}
                            value={productSearchValue}
                            data-search-box>
                        </lightning-input>
                        <div if:true={showSuggestions} class="search-suggestions">
                            <template for:each={searchSuggestions} for:item="suggestion">
                                <div 
                                    key={suggestion.id} 
                                    data-id={suggestion.id}
                                    data-name={suggestion.name}
                                    onclick={handleSuggestionSelect}
                                    class="suggestion-item">
                                    {suggestion.display}
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="search-container" style="margin-left: 20px">
                    <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                        <lightning-combobox
                            label="Filter by program"
                            placeholder="Select Program..."
                            onchange={familyPicklist}
                            options={familyOptions}
                            value={familyValue}>
                        </lightning-combobox>
                    </div>
                </div>
            </div>
            <template if:false={hideNewAllocationButton}>
                <lightning-button label="Add a new site" title="Create Order Allocation" onclick={handleCreateOrderAllocation} variant="brand" class="slds-m-left_x-small slds-form-element"></lightning-button>
            </template>

            </div>
		<div class="slds-card__body slds-card__body_inner scroll">
            <div lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
			<table class="slds-table slds-no-row-hover">
                <tr class="slds-text-title_caps yellow bold">
                    <th class="empty freeze-empty"><div></div></th>
                    <!--<th class="empty"></th>-->
                    <th class="empty"></th>
                    <th class="empty"></th>
                    <th class="empty"></th>
                    <th class="borderRight"></th>
                    <template for:each={orderAllocationsArray} for:item="allocation">
                        <th key={allocation.Id} class="wrap">
                            <div class="column-headers">
                                <div class="slds-wrap boldColumn displayName">{allocation.Order_Allocation_Display_Name__c}</div>
                            </div>

                            <div class=" allocation-controls">
                                <lightning-button-icon 
                                    icon-name="utility:settings" 
                                    size="medium" 
                                    variant="bare" 
                                    alternative-text="Configure shipment details for this column." 
                                    class="slds-m-left_medium" 
                                    title="Configure shipment details for this column." 
                                    data-id={allocation.Id} 
                                    onclick={handleConfigureDetails}>
                                </lightning-button-icon>
                                <template if:true={allocation.Order_Allocation_Editable__c}>
                                    <lightning-button-icon 
                                    icon-name="utility:refresh" 
                                    size="medium" 
                                    variant="bare" 
                                    alternative-text='Clear quantities in the "Assigned" column.'
                                    class="slds-m-left_medium"
                                    data-id={allocation.Id}
                                    onclick={handleRefreshAllocation} 
                                    title='Clear quantities in the "Assigned" column.'>
                                    </lightning-button-icon>
                                    <lightning-button-icon 
                                    icon-name="utility:delete" 
                                    size="medium" 
                                    variant="bare" 
                                    alternative-text='Click to delete this allocation column. Once selected, this action cannot be undone.'
                                    class="slds-m-left_medium"
                                    data-id={allocation.Id}
                                    onclick={handleCancelAllocation} 
                                    title="Click to delete this allocation column. Once selected, this action cannot be undone.">
                                    </lightning-button-icon>
                                </template>
                                
                                <!-- <lightning-button-icon icon-name="utility:delete" size="medium" variant="bare" alternative-text="Delete allocation" class="slds-m-left_x-small" title="Delete allocation"></lightning-button-icon> -->
                                </div>

                                <div class="allocation-status">
                                    <template if:true={allocation.inProgress}>
                                        Status: <span class="status-in-progress">In Progress</span>
                                    </template>
                                    <template if:true={allocation.confirmed}>
                                        Status: <span class="status-confirmed">Confirmed</span>
                                    </template>
                                    <template if:true={allocation.showConfigure}>
                                        Status: <span class="status-new">New</span>
                                    </template>
                                </div>

                            <!-- <div class="button">
                                <template if:true={allocation.inProgress}>       
                                    <lightning-button icon-name="utility:settings" data-id={allocation.Id} variant="base" label="Assign Shipment Details" title="Configure Shipment Details" onclick={handleConfigureDetails} class="slds-m-left_x-small configure-button"></lightning-button>
                                </template>

                                <template if:true={allocation.confirmed}>
                                    <lightning-button data-id={allocation.Id} variant="base" label="✅ View Shipment Details" title="View Shipment Details" onclick={handleConfigureDetails} class="slds-m-left_x-small configure-button"></lightning-button>                                 
                                </template>
                            </div> -->
                        </th>
                    </template>
                </tr>
                <tr class="slds-text-title_caps blue bold">
                    <th class="bold freeze-top">Product</th>
                    <th class="bold">ISBN</th>
                    <!--<th class="bold">Family</th>-->
                    <th class="bold numberCol">Available</th>
                    <th class="bold numberCol">Distributed</th>
                    <th class="bold numberCol">Remaining</th>
                    <template for:each={orderAllocationsArray} for:item="allocation">
                        <th key={allocation.Id}>
                            <div class="slds-truncate boldColumn">Assigned</div>
                        </th>
                    </template>
                </tr>
                <!--<template for:each={currentPageProducts} for:item="product">-->
                <template for:each={currentPageProducts} for:item="product">
                    <!--<template lwc:if={product.firstOfFamily}>
                        <tr key={product.Id}>
                            <td class="slds-truncate bold freeze group-label">{product.Product_Family__c}</td>
                            <td colspan="100%" class="group-label"></td>
                        </tr>
                    </template>-->
                    <tr key={product.Id} data-key1={product.Id} class="slds-table_striped">
                        <td class="slds-truncate grey bold freeze">{product.Product_Name__c}</td>
                        <!--<td class="slds-truncate grey bold freeze" style="padding: 0">
                            <div style="display: grid; grid-template-columns: 10% 90%; width: 100%;">
                                <div class="grid-row" style="--bg-color: {product.color};height: 215%;align-self: anchor-center"></div>
                                <div style="background: #f5f5f5;">{product.Product_Name__c}</div>
                            </div>
                        </td>-->
                        <td>{product.Product_ISBN__c}</td>
                        <!--<td>{product.Product_Family__c}</td>-->
                        <td>{product.Available2}</td>
                        <td>{product.Distributed}</td>
                        <td data-id="remainingCell" data-product-id={product.Id}>{product.Remaining}
                            <!--For Over Allocated Error-->
                            <c-popover style="position: absolute;right: 25%;top: -85px;display: none;" show="false" data-product-id={product.Id} data-id="popover" onclose={handleClose} body="Value of this row exceeds available quantity." header="Over Allocated" nubbin="bottom-right" size="medium" variant="error"></c-popover>
                            <!--For final year warning-->
                            <template lwc:if={isNotFinalYear}>
                                <c-popover style="position: absolute;right: 105%;top: -122px;text-wrap: wrap;display:none;" show="false" data-product-id={product.Id} data-id="popover" onclose={handleClose} body="Are you sure you want to allocate the remaining quantity of this product? There will be no more products available for future allocation." header="Review Product Allocations" nubbin="right-bottom" size="medium" variant="warning"></c-popover>
                            </template>
                        </td>
                        <template for:each={orderAllocationsArray} for:item="allocation">
                            <td key={allocation.Id} data-id="tds">
                                <template if:true={allocation.Order_Allocation_Editable__c}>
                                    <div class="circle minus" style="vertical-align: middle" data-product-id={product.Id} data-allocation-id={allocation.Id} onclick={handleDecrement}></div>
                                    <!--<lightning-icon variant="brand" data-product-id={product.Id} data-allocation-id={allocation.Id} icon-name="utility:dash" alternative-text="Subtract" title="Subtract" class="slds-icon slds-input__button_decrement circle slds-icon-utility-dash slds-icon_container" onclick={handleDecrement} size='xx-small'></lightning-icon>-->
                                    <input class="slds-input slds-input_counter" style="width: 80%" title="" data-id="input" type="number" placeholder="0" min="0" max="0" data-product-id={product.Id} data-allocation-id={allocation.Id} data-product-name={product.Name} data-allocation-name={allocation.Name} oninput={handleInput} onclick={handleInput}>
                                    <div class="circle plus" style="vertical-align: middle" data-product-id={product.Id} data-allocation-id={allocation.Id} onclick={handleIncrement}></div>
                                    <!--<lightning-icon variant="brand" data-product-id={product.Id} data-allocation-id={allocation.Id} icon-name="utility:add" alternative-text="Add" title="Add" class="slds-icon slds-input__button_increment circle slds-icon-utility-dash slds-icon_container" onclick={handleIncrement} size='xx-small'></lightning-icon>-->
                                </template>
                                <template if:false={allocation.Order_Allocation_Editable__c}>                 
                                    <input disabled class="slds-input slds-input_counter" title="" data-id="input" type="number" placeholder="0" min="0" max="0" data-product-id={product.Id} data-allocation-id={allocation.Id} data-product-name={product.Name} data-allocation-name={allocation.Name}>
                                </template>
                            </td>
                        </template>  
                    </tr>
                </template>
			</table>
		</div>

        <div if:true={usePagination} class="paginationBar">
            <div class="slds-grid slds-wrap slds-grid_align-center">
                <div class="slds-col slds-size_12-of-12 slds-medium-size_2-of-12">
                    <div class="slds-text-align_center pagination-products">
                        Showing {paginationState.showingRecordsStart} - {paginationState.showingRecordsEnd} of {totalNumberOfProducts} Total Products
                    </div>
                </div>
                <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12">
                    <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-wrap">
                        <div class="slds-col slds-size_12-of-12 slds-text-align_center slds-m-bottom_small">
                            <div class="slds-text-align_left pagination-controls">
                                Showing Page {paginationState.currentPage} of {paginationState.totalPages} Pages
                            </div>
                        </div>
                        <div class="slds-button-group" role="group">
                            <lightning-button 
                                label="First" 
                                icon-name="utility:arrow_left" 
                                icon-position="left" 
                                onclick={handleFirst}
                                disabled={paginationState.disablePreviousPage}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button 
                                label="Prev" 
                                icon-name="utility:chevronleft" 
                                icon-position="left" 
                                onclick={pageDecrement}
                                disabled={paginationState.disablePreviousPage}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-input 
                                type="number" 
                                label=" "
                                variant="label-hidden"
                                value={currentPageString}
                                min="1"
                                max={paginationState.totalPages}
                                disabled={paginationState.disableAllPagination}
                                class="page-number-input slds-m-horizontal_x-small"
                                onchange={navigateToPage}>
                            </lightning-input>
                            <lightning-button 
                                label="Next" 
                                icon-name="utility:chevronright" 
                                icon-position="right" 
                                onclick={pageIncrement}
                                disabled={paginationState.disableNextPage}
                                class="slds-m-left_x-small">
                            </lightning-button>
                            <lightning-button 
                                label="Last" 
                                icon-name="utility:arrow_right" 
                                icon-position="right" 
                                onclick={handleLast}
                                disabled={paginationState.disableNextPage}
                                class="slds-m-left_x-small">
                            </lightning-button>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_12-of-12 slds-medium-size_2-of-12">
                    <div class="slds-form-element pagination-column">
                        <div class="pagination-label slds-text-align_center">
                            Products Per Page
                        </div>
                        <div class="slds-form-element__control">
                            <lightning-combobox
                                label=" "
                                variant="label-hidden"
                                value={itemsPerPageString} 
                                options={itemsPerPageOptions} 
                                onchange={changeItemsPerPage} 
                                class="slds-m-horizontal_x-small">
                            </lightning-combobox>
                        </div>
                    </div>
                </div>

            </div>
        </div>

	</lightning-card>
</template>
